  font-family: 'Sora', system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
}

button {
  font-family: inherit;
}

::-moz-selection {
  background: #3b82ff;
  color: white;
}

::selection {
  background: #3b82ff;
  color: white;
}

.font-mono-x {
  font-family: 'JetBrains Mono', ui-monospace, monospace;
}

.ambient {
  background:
    radial-gradient(760px 420px at 12% -5%, rgba(59, 130, 255, 0.34), transparent 62%),
    radial-gradient(720px 460px at 88% 4%, rgba(139, 92, 246, 0.28), transparent 62%),
    radial-gradient(640px 420px at 52% 24%, rgba(255, 122, 24, 0.16), transparent 60%),
    var(--bg);
}

.grid-lines {
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 56px 56px;
  mask-image: radial-gradient(ellipse 90% 70% at 50% 0%, black 25%, transparent 78%);
  -webkit-mask-image: radial-gradient(ellipse 90% 70% at 50% 0%, black 25%, transparent 78%);
}

.glass {
  background: var(--surface);
  border: 1px solid var(--line);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
}

.glass-strong {
  background: var(--surface-strong);
  border: 1px solid var(--line);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
}

.gradient-text {
  background: linear-gradient(92deg, #ff8a1e 0%, #ff4d6d 48%, #ff3d8a 100%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

.rise {
  animation: rise 0.75s cubic-bezier(0.2, 0.8, 0.2, 1) both;
}

.rise-1 {
  animation-delay: 0.06s;
}

.rise-2 {
  animation-delay: 0.14s;
}

.rise-3 {
  animation-delay: 0.22s;
}

.rise-4 {
  animation-delay: 0.3s;
}

@keyframes rise {
  from {
    opacity: 0;
    transform: translateY(22px);
  }

  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.pulse-dot {
  position: relative;
}

.pulse-dot::after {
  content: "";
  position: absolute;
  inset: -4px;
  border-radius: 999px;
  border: 2px solid var(--green);
  opacity: 0.65;
  animation: ping 1.7s cubic-bezier(0,0,.2,1) infinite;
}

@keyframes ping {
  75%, 100% {
    transform: scale(2);
    opacity: 0;
  }
}

.blink {
  animation: blink 1s step-end infinite;
}

@keyframes blink {
  50% {
    opacity: 0;
  }
}

.fade-swap {
  transition: opacity 0.18s ease, transform 0.18s ease;
}

.fade-swap.is-out {
  opacity: 0;
  transform: translateY(4px);
}

.card-hover {
  transition: transform 0.35s ease, border-color 0.35s ease, box-shadow 0.35s ease;
}

.card-hover:hover {
  transform: translateY(-7px);
  border-color: var(--line-bright);
  box-shadow: 0 24px 55px rgba(59, 130, 255, 0.16), var(--shadow);
}

.mode-btn {
  transition: all 0.25s ease;
}

.mode-btn.active {
  background: linear-gradient(92deg, #2563eb, #7c3aed);
  border-color: transparent;
  color: white;
  box-shadow: 0 14px 34px rgba(79, 70, 229, 0.38);
}

.terminal {
  background: #060a18;
  border: 1px solid rgba(255,255,255,0.13);
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.06), 0 28px 70px rgba(0,0,0,0.42);
}

@media (prefers-reduced-motion: reduce) {
  .rise, .pulse-dot::after, .blink {
    animation: none !important;
  }
}
