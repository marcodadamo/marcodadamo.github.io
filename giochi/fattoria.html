<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D Farm Simulator - Fattoria 3D.</title>
    <!-- Tailwind CSS for modern UI -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Three.js for 3D Graphics -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #1a1a1a;
            font-family: 'Inter', sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
        /* Virtual Joystick styling */
        #joystick-base {
            position: absolute;
            bottom: 40px;
            left: 40px;
            width: 120px;
            height: 120px;
            background: rgba(255, 255, 255, 0.15);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            touch-action: none;
            display: none;
            z-index: 20;
        }
        #joystick-handle {
            position: absolute;
            top: 35px;
            left: 35px;
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            pointer-events: none;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body class="text-white">

    <!-- 3D Canvas Container -->
    <div id="canvas-container" class="absolute inset-0"></div>

    <!-- UI Overlay -->
    <div id="ui-overlay" class="absolute inset-0 pointer-events-none flex flex-col justify-between p-4 sm:p-6 z-10">
        
        <!-- Top Header & Stats -->
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 bg-black/40 backdrop-blur-md p-4 rounded-2xl border border-white/10 pointer-events-auto">
            <div>
                <h1 class="text-xl sm:text-2xl font-black text-amber-400 tracking-wider drop-shadow">🚜 FATTORIA 3D SIMULATOR</h1>
                <p id="level-title" class="text-xs sm:text-sm text-gray-300 font-medium">Livello 1: Aratura del Terreno</p>
            </div>
            
            <div class="flex items-center gap-4">
                <div class="bg-emerald-900/60 border border-emerald-500/30 px-3 py-1.5 rounded-xl text-center">
                    <span class="block text-[10px] text-emerald-300 font-bold uppercase tracking-wider">Completamento</span>
                    <span id="progress-val" class="text-lg font-extrabold text-emerald-400">0%</span>
                </div>
                <div class="bg-amber-900/60 border border-amber-500/30 px-3 py-1.5 rounded-xl text-center">
                    <span class="block text-[10px] text-amber-300 font-bold uppercase tracking-wider">Monete</span>
                    <span id="coins-val" class="text-lg font-extrabold text-amber-400">0 🌾</span>
                </div>
            </div>
        </div>

        <!-- Center Notification / Mission Banner -->
        <div id="notification-banner" class="self-center bg-black/70 backdrop-blur-md border border-amber-500/40 px-6 py-3 rounded-2xl text-center shadow-2xl transition-all duration-300 pointer-events-auto">
            <p id="mission-text" class="text-sm sm:text-base font-semibold text-amber-300">Usa W/A/S/D o il Joystick per guidare il Trattore e arare il campo!</p>
        </div>

        <!-- Bottom Controls / Vehicle Switcher -->
        <div class="flex flex-col sm:flex-row justify-between items-end sm:items-center gap-4 pointer-events-auto">
            
            <!-- Vehicle & Tool Selectors -->
            <div class="flex flex-wrap gap-2 bg-black/40 backdrop-blur-md p-2 rounded-2xl border border-white/10">
                <button onclick="switchVehicle('farmer')" id="btn-farmer" class="px-3.5 py-2 bg-zinc-700 hover:bg-zinc-600 rounded-xl font-bold text-xs transition shadow flex items-center gap-2">
                    👨‍🌾 Contadino
                </button>
                <button onclick="switchVehicle('tractor')" id="btn-tractor" class="px-3.5 py-2 bg-emerald-600 hover:bg-emerald-500 rounded-xl font-bold text-xs transition shadow flex items-center gap-2">
                    🚜 Trattore
                </button>
                <button onclick="switchVehicle('harvester')" id="btn-harvester" class="px-3.5 py-2 bg-zinc-700 hover:bg-zinc-600 rounded-xl font-bold text-xs transition shadow flex items-center gap-2">
                    🌾 Mietitrebbia
                </button>
            </div>

            <!-- Attachments (Plow, Harrow, Trailer) -->
            <div class="flex flex-wrap gap-2 bg-black/40 backdrop-blur-md p-2 rounded-2xl border border-white/10">
                <button onclick="attachTool('plow')" id="btn-plow" class="px-3 py-1.5 bg-amber-700 hover:bg-amber-600 rounded-xl font-semibold text-xs transition">
                    Aratro
                </button>
                <button onclick="attachTool('harrow')" id="btn-harrow" class="px-3 py-1.5 bg-zinc-700 hover:bg-zinc-600 rounded-xl font-semibold text-xs transition">
                    Erpice
                </button>
                <button onclick="attachTool('trailer')" id="btn-trailer" class="px-3 py-1.5 bg-zinc-700 hover:bg-zinc-600 rounded-xl font-semibold text-xs transition">
                    Rimorchio
                </button>
                <button onclick="nextLevel()" class="px-4 py-1.5 bg-gradient-to-r from-amber-500 to-orange-600 hover:from-amber-400 hover:to-orange-500 rounded-xl font-bold text-xs text-black transition shadow-lg">
                    Prossimo Livello ➡️
                </button>
            </div>

        </div>
    </div>

    <!-- Virtual Joystick for Mobile -->
    <div id="joystick-base">
        <div id="joystick-handle"></div>
    </div>

    <!-- Message Modal Overlay -->
    <div id="message-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-zinc-900 border border-amber-500/40 p-6 sm:p-8 rounded-3xl max-w-md w-full text-center shadow-2xl">
            <h3 id="modal-title" class="text-2xl font-black text-amber-400 mb-2">Livello Completato!</h3>
            <p id="modal-desc" class="text-gray-300 text-sm sm:text-base mb-6">Ottimo lavoro! Il terreno è pronto per la prossima fase agricola.</p>
            <button onclick="closeModal()" class="w-full py-3 bg-gradient-to-r from-amber-500 to-orange-600 hover:from-amber-400 hover:to-orange-500 text-black font-extrabold rounded-2xl shadow-lg transition">
                Continua
            </button>
        </div>
    </div>

    <!-- Game Logic Script -->
    <script>
        // --- GAME STATE ---
        let scene, camera, renderer;
        let farmer, tractor, harvester, plowMesh, harrowMesh, trailerMesh;
        let currentVehicle = 'tractor';
        let currentTool = 'plow';
        let currentLevel = 1;
        let coins = 0;
        let progress = 0;
        let fieldBlocks = [];
        
        // Controls state
        const keys = { w: false, a: false, s: false, d: false, space: false };
        let touchActive = false;
        let touchVector = { x: 0, y: 0 };

        // Vehicle parameters
        const vehicleState = {
            pos: { x: 0, z: 0 },
            rot: 0,
            speed: 0,
            maxSpeed: 0.25,
            accel: 0.01,
            friction: 0.92
        };

        const farmerState = {
            pos: { x: 5, z: 5 },
            rot: 0,
            speed: 0
        };

        // Initialize Three.js Environment
        function init() {
            const container = document.getElementById('canvas-container');
            
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87ceeb); // Sky blue
            scene.fog = new THREE.FogExp2(0x87ceeb, 0.015);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            
            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            container.appendChild(renderer.domElement);

            // Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const sunLight = new THREE.DirectionalLight(0xfff8e7, 1.0);
            sunLight.position.set(50, 80, 50);
            sunLight.castShadow = true;
            sunLight.shadow.mapSize.width = 2048;
            sunLight.shadow.mapSize.height = 2048;
            sunLight.shadow.camera.near = 0.5;
            sunLight.shadow.camera.far = 300;
            const d = 60;
            sunLight.shadow.camera.left = -d;
            sunLight.shadow.camera.right = d;
            sunLight.shadow.camera.top = d;
            sunLight.shadow.camera.bottom = -d;
            scene.add(sunLight);

            // Build Farm Environment
            createTerrain();
            createEnvironmentProps();
            
            // Build Characters & Vehicles
            farmer = createFarmerMesh();
            tractor = createTractorMesh();
            harvester = createHarvesterMesh();
            
            plowMesh = createPlowMesh();
            harrowMesh = createHarrowMesh();
            trailerMesh = createTrailerMesh();

            scene.add(farmer);
            scene.add(tractor);
            scene.add(harvester);
            scene.add(plowMesh);
            scene.add(harrowMesh);
            scene.add(trailerMesh);

            updateActiveVehicleVisibility();

            // Event Listeners
            window.addEventListener('resize', onWindowResize);
            window.addEventListener('keydown', (e) => handleKey(e, true));
            window.addEventListener('keyup', (e) => handleKey(e, false));
            
            setupMobileJoystick();

            // Start Animation Loop
            animate();
        }

        // --- ENVIRONMENT CREATION ---
        function createTerrain() {
            // Ground
            const groundGeo = new THREE.PlaneGeometry(300, 300, 32, 32);
            const groundMat = new THREE.MeshStandardMaterial({ color: 0x3b7a57, roughness: 0.9 });
            const ground = new THREE.Mesh(groundGeo, groundMat);
            ground.rotation.x = -Math.PI / 2;
            ground.receiveShadow = true;
            scene.add(ground);

            // Cultivable Field Grid
            const fieldSize = 10;
            const spacing = 4;
            const startX = - (fieldSize * spacing) / 2;
            const startZ = - (fieldSize * spacing) / 2;

            for (let i = 0; i < fieldSize; i++) {
                for (let j = 0; j < fieldSize; j++) {
                    const blockGeo = new THREE.BoxGeometry(3.6, 0.1, 3.6);
                    const blockMat = new THREE.MeshStandardMaterial({ color: 0x8b5a2b, roughness: 1.0 }); // Rich soil
                    const block = new THREE.Mesh(blockGeo, blockMat);
                    block.position.set(startX + i * spacing + 2, 0.05, startZ + j * spacing + 2);
                    block.receiveShadow = true;
                    block.userData = { plowed: false, harrowed: false, sown: false, harvested: false };
                    scene.add(block);
                    fieldBlocks.push(block);
                }
            }
        }

        function createEnvironmentProps() {
            // Simple Farmhouse & Barn
            const barnGeo = new THREE.BoxGeometry(12, 8, 18);
            const barnMat = new THREE.MeshStandardMaterial({ color: 0xcc3333 });
            const barn = new THREE.Mesh(barnGeo, barnMat);
            barn.position.set(-35, 4, -25);
            barn.castShadow = true;
            barn.receiveShadow = true;
            scene.add(barn);

            // Barn Roof
            const roofGeo = new THREE.ConeGeometry(10, 6, 4);
            const roofMat = new THREE.MeshStandardMaterial({ color: 0x222222 });
            const roof = new THREE.Mesh(roofGeo, roofMat);
            roof.position.set(-35, 10, -25);
            roof.rotation.y = Math.PI / 4;
            roof.castShadow = true;
            scene.add(roof);

            // Trees surrounding the farm
            for (let i = 0; i < 25; i++) {
                const angle = Math.random() * Math.PI * 2;
                const dist = 60 + Math.random() * 60;
                const x = Math.cos(angle) * dist;
                const z = Math.sin(angle) * dist;
                createTree(x, z);
            }
        }

        function createTree(x, z) {
            const group = new THREE.Group();
            
            const trunkGeo = new THREE.CylinderGeometry(0.8, 1.2, 5, 6);
            const trunkMat = new THREE.MeshStandardMaterial({ color: 0x5c4033 });
            const trunk = new THREE.Mesh(trunkGeo, trunkMat);
            trunk.position.y = 2.5;
            trunk.castShadow = true;
            group.add(trunk);

            const leavesGeo = new THREE.DodecahedronGeometry(4);
            const leavesMat = new THREE.MeshStandardMaterial({ color: 0x2e8b57, roughness: 0.8 });
            const leaves = new THREE.Mesh(leavesGeo, leavesMat);
            leaves.position.y = 6.5;
            leaves.castShadow = true;
            group.add(leaves);

            group.position.set(x, 0, z);
            scene.add(group);
        }

        // --- VEHICLE & CHARACTER MODELS ---
        function createFarmerMesh() {
            const group = new THREE.Group();
            
            // Body
            const bodyGeo = new THREE.BoxGeometry(0.8, 1.2, 0.5);
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0x2563eb }); // Blue overalls
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.y = 1.0;
            body.castShadow = true;
            group.add(body);

            // Head
            const headGeo = new THREE.SphereGeometry(0.35, 8, 8);
            const headMat = new THREE.MeshStandardMaterial({ color: 0xffdbac });
            const head = new THREE.Mesh(headGeo, headMat);
            head.position.y = 1.8;
            head.castShadow = true;
            group.add(head);

            // Hat
            const hatGeo = new THREE.CylinderGeometry(0.45, 0.45, 0.15, 8);
            const hatMat = new THREE.MeshStandardMaterial({ color: 0xd97706 });
            const hat = new THREE.Mesh(hatGeo, hatMat);
            hat.position.y = 2.05;
            group.add(hat);

            return group;
        }

        // Detailed CLAAS Axion 960 Model
        function createTractorMesh() {
            const group = new THREE.Group();

            // Color Palette based on CLAAS Axion 960
            const claasGreenMat = new THREE.MeshStandardMaterial({ color: 0x83B81A, roughness: 0.3 }); // CLAAS Lime Green
            const claasRedMat = new THREE.MeshStandardMaterial({ color: 0xD12027, roughness: 0.4 });   // CLAAS Red (Rims)
            const darkChassisMat = new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.7 });// Dark Grey/Black
            const tireRubberMat = new THREE.MeshStandardMaterial({ color: 0x151515, roughness: 0.9 }); // Dark Rubber
            const glassMat = new THREE.MeshStandardMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.45, roughness: 0.1 }); // Tinted Glass
            const mirrorMat = new THREE.MeshStandardMaterial({ color: 0xcccccc, metalness: 0.8, roughness: 0.2 });

            // 1. Lower Chassis Base
            const chassisGeo = new THREE.BoxGeometry(1.6, 0.8, 3.6);
            const chassis = new THREE.Mesh(chassisGeo, darkChassisMat);
            chassis.position.set(0, 0.8, 0);
            chassis.castShadow = true;
            group.add(chassis);

            // Side steps
            const stepGeo = new THREE.BoxGeometry(0.5, 0.4, 0.8);
            const leftStep = new THREE.Mesh(stepGeo, darkChassisMat);
            leftStep.position.set(-1.0, 0.6, -0.2);
            group.add(leftStep);

            // 2. Bonnet / Hood (Sloped CLAAS style)
            const bonnetGroup = new THREE.Group();
            
            const hoodMainGeo = new THREE.BoxGeometry(1.5, 0.9, 2.0);
            const hoodMain = new THREE.Mesh(hoodMainGeo, claasGreenMat);
            hoodMain.position.set(0, 1.6, 0.8);
            hoodMain.castShadow = true;
            bonnetGroup.add(hoodMain);

            // Front Grill Assembly
            const grillGeo = new THREE.BoxGeometry(1.4, 0.85, 0.2);
            const grill = new THREE.Mesh(grillGeo, darkChassisMat);
            grill.position.set(0, 1.55, 1.81);
            bonnetGroup.add(grill);

            // CLAAS Logo Strip
            const logoGeo = new THREE.BoxGeometry(1.0, 0.2, 0.05);
            const logoMat = new THREE.MeshStandardMaterial({ color: 0xffffff });
            const logo = new THREE.Mesh(logoGeo, logoMat);
            logo.position.set(0, 1.7, 1.9);
            bonnetGroup.add(logo);

            // Front Headlights
            const lightGeo = new THREE.BoxGeometry(0.3, 0.15, 0.08);
            const lightMat = new THREE.MeshStandardMaterial({ color: 0xfffbeb, emissive: 0xfffbeb, emissiveIntensity: 0.5 });
            const lightL = new THREE.Mesh(lightGeo, lightMat);
            lightL.position.set(-0.5, 1.45, 1.91);
            const lightR = new THREE.Mesh(lightGeo, lightMat);
            lightR.position.set(0.5, 1.45, 1.91);
            bonnetGroup.add(lightL);
            bonnetGroup.add(lightR);

            group.add(bonnetGroup);

            // Exhaust Stack & Air Intake
            const exhaustGeo = new THREE.CylinderGeometry(0.08, 0.08, 1.6, 12);
            const exhaust = new THREE.Mesh(exhaustGeo, darkChassisMat);
            exhaust.position.set(0.75, 2.2, 0.2);
            group.add(exhaust);

            // 3. Cabin (High visibility glass cab)
            const cabinGroup = new THREE.Group();

            // Cabin Roof
            const roofGeo = new THREE.BoxGeometry(1.8, 0.2, 2.0);
            const roof = new THREE.Mesh(roofGeo, claasGreenMat);
            roof.position.set(0, 2.95, -0.5);
            roof.castShadow = true;
            cabinGroup.add(roof);

            // Roof Beacons & Worklights
            const beaconGeo = new THREE.CylinderGeometry(0.08, 0.08, 0.15, 8);
            const beaconMat = new THREE.MeshStandardMaterial({ color: 0xf97316, emissive: 0xf97316 });
            const beacon = new THREE.Mesh(beaconGeo, beaconMat);
            beacon.position.set(-0.8, 3.1, -1.3);
            cabinGroup.add(beacon);

            // Glass Enclosure
            const glassGeo = new THREE.BoxGeometry(1.65, 1.2, 1.8);
            const glass = new THREE.Mesh(glassGeo, glassMat);
            glass.position.set(0, 2.25, -0.5);
            cabinGroup.add(glass);

            // Cabin Pillars (Pillars framing the cabin)
            const pillarGeo = new THREE.BoxGeometry(0.1, 1.2, 0.1);
            const p1 = new THREE.Mesh(pillarGeo, darkChassisMat); p1.position.set(-0.8, 2.25, 0.35);
            const p2 = new THREE.Mesh(pillarGeo, darkChassisMat); p2.position.set(0.8, 2.25, 0.35);
            const p3 = new THREE.Mesh(pillarGeo, darkChassisMat); p3.position.set(-0.8, 2.25, -1.35);
            const p4 = new THREE.Mesh(pillarGeo, darkChassisMat); p4.position.set(0.8, 2.25, -1.35);
            cabinGroup.add(p1); cabinGroup.add(p2); cabinGroup.add(p3); cabinGroup.add(p4);

            // Side Mirrors
            const mirrorArmGeo = new THREE.BoxGeometry(0.4, 0.05, 0.05);
            const mirrorHeadGeo = new THREE.BoxGeometry(0.05, 0.3, 0.2);
            
            const mirrorL = new THREE.Group();
            const armL = new THREE.Mesh(mirrorArmGeo, darkChassisMat);
            const headL = new THREE.Mesh(mirrorHeadGeo, mirrorMat);
            headL.position.set(-0.2, 0, 0);
            mirrorL.add(armL); mirrorL.add(headL);
            mirrorL.position.set(-0.9, 2.5, 0.2);

            const mirrorR = mirrorL.clone();
            mirrorR.rotation.y = Math.PI;
            mirrorR.position.set(0.9, 2.5, 0.2);

            cabinGroup.add(mirrorL);
            cabinGroup.add(mirrorR);

            group.add(cabinGroup);

            // 4. Mudguards / Fenders
            const rearFenderGeo = new THREE.BoxGeometry(0.6, 0.6, 1.8);
            const fenderL = new THREE.Mesh(rearFenderGeo, claasGreenMat);
            fenderL.position.set(-1.1, 1.5, -0.9);
            const fenderR = new THREE.Mesh(rearFenderGeo, claasGreenMat);
            fenderR.position.set(1.1, 1.5, -0.9);
            group.add(fenderL);
            group.add(fenderR);

            // 5. Wheels & Rims (Large Treaded Tires with CLAAS Red Rims)
            function createWheel(tireRadius, tireWidth, isFront) {
                const wheelGroup = new THREE.Group();

                // Tire Tread Geometry
                const tireGeo = new THREE.CylinderGeometry(tireRadius, tireRadius, tireWidth, 24);
                tireGeo.rotateZ(Math.PI / 2);
                const tire = new THREE.Mesh(tireGeo, tireRubberMat);
                tire.castShadow = true;
                wheelGroup.add(tire);

                // Red Rim Center
                const rimGeo = new THREE.CylinderGeometry(tireRadius * 0.55, tireRadius * 0.55, tireWidth + 0.02, 16);
                rimGeo.rotateZ(Math.PI / 2);
                const rim = new THREE.Mesh(rimGeo, claasRedMat);
                wheelGroup.add(rim);

                // Central Axle Hub
                const hubGeo = new THREE.CylinderGeometry(tireRadius * 0.25, tireRadius * 0.25, tireWidth + 0.06, 12);
                hubGeo.rotateZ(Math.PI / 2);
                const hub = new THREE.Mesh(hubGeo, darkChassisMat);
                wheelGroup.add(hub);

                return wheelGroup;
            }

            // Rear Large Wheels
            const wheelRL = createWheel(1.1, 0.7, false);
            wheelRL.position.set(-1.25, 1.1, -0.9);
            group.add(wheelRL);

            const wheelRR = createWheel(1.1, 0.7, false);
            wheelRR.position.set(1.25, 1.1, -0.9);
            group.add(wheelRR);

            // Front Smaller Wheels
            const wheelFL = createWheel(0.75, 0.5, true);
            wheelFL.position.set(-1.1, 0.75, 1.1);
            group.add(wheelFL);

            const wheelFR = createWheel(0.75, 0.5, true);
            wheelFR.position.set(1.1, 0.75, 1.1);
            group.add(wheelFR);

            return group;
        }

        function createHarvesterMesh() {
            const group = new THREE.Group();

            // Main Body
            const bodyGeo = new THREE.BoxGeometry(3.0, 2.2, 5.0);
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0xf59e0b, roughness: 0.4 }); // Yellow harvester
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.y = 1.6;
            body.castShadow = true;
            group.add(body);

            // Front Header (Cutting platform)
            const headerGeo = new THREE.BoxGeometry(4.8, 0.8, 1.5);
            const headerMat = new THREE.MeshStandardMaterial({ color: 0x334155 });
            const header = new THREE.Mesh(headerGeo, headerMat);
            header.position.set(0, 0.8, 3.0);
            header.castShadow = true;
            group.add(header);

            // Large Wheels
            const wheelMat = new THREE.MeshStandardMaterial({ color: 0x111111 });
            const wheelGeo = new THREE.CylinderGeometry(1.2, 1.2, 0.8, 16);
            wheelGeo.rotateZ(Math.PI / 2);

            const w1 = new THREE.Mesh(wheelGeo, wheelMat);
            w1.position.set(-1.7, 1.2, -1.5);
            group.add(w1);

            const w2 = new THREE.Mesh(wheelGeo, wheelMat);
            w2.position.set(1.7, 1.2, -1.5);
            group.add(w2);

            return group;
        }

        function createPlowMesh() {
            const group = new THREE.Group();
            const barGeo = new THREE.BoxGeometry(3.2, 0.3, 0.8);
            const mat = new THREE.MeshStandardMaterial({ color: 0x475569, metalness: 0.8 });
            const bar = new THREE.Mesh(barGeo, mat);
            bar.position.y = 0.5;
            group.add(bar);

            // Blades
            for(let i = -1.2; i <= 1.2; i += 0.8) {
                const bladeGeo = new THREE.BoxGeometry(0.5, 0.8, 1.2);
                const blade = new THREE.Mesh(bladeGeo, mat);
                blade.position.set(i, 0.2, -0.6);
                blade.rotation.x = 0.3;
                group.add(blade);
            }
            return group;
        }

        function createHarrowMesh() {
            const group = new THREE.Group();
            const frameGeo = new THREE.BoxGeometry(3.6, 0.2, 2.0);
            const mat = new THREE.MeshStandardMaterial({ color: 0x1e293b, metalness: 0.6 });
            const frame = new THREE.Mesh(frameGeo, mat);
            frame.position.y = 0.6;
            group.add(frame);

            // Rotating disks / Spikes
            for(let x = -1.4; x <= 1.4; x += 0.7) {
                for(let z = -0.6; z <= 0.6; z += 0.6) {
                    const diskGeo = new THREE.CylinderGeometry(0.3, 0.3, 0.1, 8);
                    const disk = new THREE.Mesh(diskGeo, mat);
                    disk.position.set(x, 0.2, z);
                    disk.rotation.z = Math.PI / 2;
                    group.add(disk);
                }
            }
            return group;
        }

        function createTrailerMesh() {
            const group = new THREE.Group();
            const bedGeo = new THREE.BoxGeometry(2.6, 1.2, 4.2);
            const mat = new THREE.MeshStandardMaterial({ color: 0x15803d, roughness: 0.5 }); // Green trailer
            const bed = new THREE.Mesh(bedGeo, mat);
            bed.position.y = 1.0;
            bed.castShadow = true;
            group.add(bed);

            // Wheels
            const wheelMat = new THREE.MeshStandardMaterial({ color: 0x111111 });
            const wheelGeo = new THREE.CylinderGeometry(0.7, 0.7, 0.5, 16);
            wheelGeo.rotateZ(Math.PI / 2);

            const w1 = new THREE.Mesh(wheelGeo, wheelMat);
            w1.position.set(-1.5, 0.7, 0.5);
            group.add(w1);

            const w2 = new THREE.Mesh(wheelGeo, wheelMat);
            w2.position.set(1.5, 0.7, 0.5);
            group.add(w2);

            return group;
        }

        // --- GAMEPLAY CONTROLS & LOGIC ---
        function switchVehicle(type) {
            currentVehicle = type;
            document.getElementById('btn-farmer').className = `px-3.5 py-2 rounded-xl font-bold text-xs transition shadow flex items-center gap-2 ${type === 'farmer' ? 'bg-blue-600' : 'bg-zinc-700 hover:bg-zinc-600'}`;
            document.getElementById('btn-tractor').className = `px-3.5 py-2 rounded-xl font-bold text-xs transition shadow flex items-center gap-2 ${type === 'tractor' ? 'bg-emerald-600' : 'bg-zinc-700 hover:bg-zinc-600'}`;
            document.getElementById('btn-harvester').className = `px-3.5 py-2 rounded-xl font-bold text-xs transition shadow flex items-center gap-2 ${type === 'harvester' ? 'bg-amber-600' : 'bg-zinc-700 hover:bg-zinc-600'}`;
            
            updateActiveVehicleVisibility();
            updateMissionText();
        }

        function attachTool(tool) {
            currentTool = tool;
            document.getElementById('btn-plow').className = `px-3 py-1.5 rounded-xl font-semibold text-xs transition ${tool === 'plow' ? 'bg-amber-700' : 'bg-zinc-700 hover:bg-zinc-600'}`;
            document.getElementById('btn-harrow').className = `px-3 py-1.5 rounded-xl font-semibold text-xs transition ${tool === 'harrow' ? 'bg-amber-700' : 'bg-zinc-700 hover:bg-zinc-600'}`;
            document.getElementById('btn-trailer').className = `px-3 py-1.5 rounded-xl font-semibold text-xs transition ${tool === 'trailer' ? 'bg-amber-700' : 'bg-zinc-700 hover:bg-zinc-600'}`;
            
            updateActiveVehicleVisibility();
            updateMissionText();
        }

        function updateActiveVehicleVisibility() {
            farmer.visible = (currentVehicle === 'farmer');
            tractor.visible = (currentVehicle === 'tractor');
            harvester.visible = (currentVehicle === 'harvester');

            plowMesh.visible = (currentVehicle === 'tractor' && currentTool === 'plow');
            harrowMesh.visible = (currentVehicle === 'tractor' && currentTool === 'harrow');
            trailerMesh.visible = (currentVehicle === 'tractor' && currentTool === 'trailer');
        }

        function updateMissionText() {
            const missionEl = document.getElementById('mission-text');
            if (currentLevel === 1) {
                missionEl.innerText = "Livello 1: Monta l'Aratro e ara il terreno passando sopra le zolle marroni!";
            } else if (currentLevel === 2) {
                missionEl.innerText = "Livello 2: Monta l'Erpice Rotante per affinare e preparare il terreno.";
            } else if (currentLevel === 3) {
                missionEl.innerText = "Livello 3: Guida la Mietitrebbia per raccogliere il grano maturo!";
            }
        }

        function nextLevel() {
            currentLevel++;
            if (currentLevel > 3) currentLevel = 1;
            
            // Reset field blocks
            fieldBlocks.forEach(b => {
                b.userData.plowed = false;
                b.userData.harrowed = false;
                b.userData.harvested = false;
                b.material.color.setHex(0x8b5a2b);
            });
            progress = 0;
            document.getElementById('progress-val').innerText = '0%';

            if (currentLevel === 2) {
                document.getElementById('level-title').innerText = "Livello 2: Erpicatura";
                attachTool('harrow');
            } else if (currentLevel === 3) {
                document.getElementById('level-title').innerText = "Livello 3: Raccolta con Mietitrebbia";
                switchVehicle('harvester');
            } else {
                document.getElementById('level-title').innerText = "Livello 1: Aratura";
                switchVehicle('tractor');
                attachTool('plow');
            }
            updateMissionText();
        }

        function handleKey(e, isDown) {
            switch(e.key.toLowerCase()) {
                case 'w': case 'arrowup': keys.w = isDown; break;
                case 'a': case 'arrowleft': keys.a = isDown; break;
                case 's': case 'arrowdown': keys.s = isDown; break;
                case 'd': case 'arrowright': keys.d = isDown; break;
            }
        }

        function setupMobileJoystick() {
            const base = document.getElementById('joystick-base');
            const handle = document.getElementById('joystick-handle');
            
            // Show joystick on mobile/touch interaction or keep available
            base.style.display = 'block';

            let activeTouchId = null;
            let baseRect = {};

            base.addEventListener('touchstart', (e) => {
                e.preventDefault();
                const touch = e.changedTouches[0];
                activeTouchId = touch.identifier;
                baseRect = base.getBoundingClientRect();
                touchActive = true;
            });

            window.addEventListener('touchmove', (e) => {
                if (!touchActive) return;
                for (let i = 0; i < e.changedTouches.length; i++) {
                    const touch = e.changedTouches[i];
                    if (touch.identifier === activeTouchId) {
                        const centerX = baseRect.left + baseRect.width / 2;
                        const centerY = baseRect.top + baseRect.height / 2;
                        
                        let dx = touch.clientX - centerX;
                        let dy = touch.clientY - centerY;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        const maxDist = 45;

                        if (dist > maxDist) {
                            dx = (dx / dist) * maxDist;
                            dy = (dy / dist) * maxDist;
                        }

                        handle.style.transform = `translate(${dx}px, ${dy}px)`;
                        touchVector.x = dx / maxDist;
                        touchVector.y = dy / maxDist;
                    }
                }
            }, { passive: false });

            const endTouch = (e) => {
                for (let i = 0; i < e.changedTouches.length; i++) {
                    if (e.changedTouches[i].identifier === activeTouchId) {
                        touchActive = false;
                        touchVector.x = 0;
                        touchVector.y = 0;
                        handle.style.transform = `translate(0px, 0px)`;
                    }
                }
            };

            window.addEventListener('touchend', endTouch);
            window.addEventListener('touchcancel', endTouch);
        }

        // --- MAIN GAME LOOP ---
        function updateGame() {
            let moveInput = 0;
            let steerInput = 0;

            // Keyboard input
            if (keys.w) moveInput += 1;
            if (keys.s) moveInput -= 1;
            if (keys.a) steerInput += 1;
            if (keys.d) steerInput -= 1;

            // Touch Joystick input
            if (touchActive) {
                moveInput -= touchVector.y; // Forward/Backward
                steerInput -= touchVector.x; // Left/Right
            }

            if (currentVehicle === 'farmer') {
                // Farmer movement
                if (moveInput !== 0) {
                    farmerState.speed = moveInput * 0.1;
                    farmerState.rot += steerInput * 0.05;
                    farmerState.pos.x += Math.sin(farmerState.rot) * farmerState.speed;
                    farmerState.pos.z += Math.cos(farmerState.rot) * farmerState.speed;
                }
                farmer.position.set(farmerState.pos.x, 0, farmerState.pos.z);
                farmer.rotation.y = farmerState.rot;

                // Camera follow farmer
                camera.position.set(farmerState.pos.x - Math.sin(farmerState.rot) * 8, 5, farmerState.pos.z - Math.cos(farmerState.rot) * 8);
                camera.lookAt(farmerState.pos.x, 1, farmerState.pos.z);

            } else {
                // Vehicle movement (Tractor / Harvester)
                if (moveInput !== 0) {
                    vehicleState.speed += moveInput * vehicleState.accel;
                    vehicleState.speed = Math.max(-0.1, Math.min(vehicleState.speed, vehicleState.maxSpeed));
                } else {
                    vehicleState.speed *= vehicleState.friction;
                }

                if (Math.abs(vehicleState.speed) > 0.005) {
                    vehicleState.rot += steerInput * (vehicleState.speed * 0.15);
                }

                vehicleState.pos.x += Math.sin(vehicleState.rot) * vehicleState.speed;
                vehicleState.pos.z += Math.cos(vehicleState.rot) * vehicleState.speed;

                const activeObj = (currentVehicle === 'tractor') ? tractor : harvester;
                activeObj.position.set(vehicleState.pos.x, 0, vehicleState.pos.z);
                activeObj.rotation.y = vehicleState.rot;

                // Position tools behind tractor
                const backX = vehicleState.pos.x - Math.sin(vehicleState.rot) * 2.5;
                const backZ = vehicleState.pos.z - Math.cos(vehicleState.rot) * 2.5;

                plowMesh.position.set(backX, 0, backZ);
                plowMesh.rotation.y = vehicleState.rot;

                harrowMesh.position.set(backX, 0, backZ);
                harrowMesh.rotation.y = vehicleState.rot;

                trailerMesh.position.set(backX - Math.sin(vehicleState.rot) * 2, 0, backZ - Math.cos(vehicleState.rot) * 2);
                trailerMesh.rotation.y = vehicleState.rot;

                // Camera follow vehicle smoothly
                const targetCamX = vehicleState.pos.x - Math.sin(vehicleState.rot) * 12;
                const targetCamZ = vehicleState.pos.z - Math.cos(vehicleState.rot) * 12;
                camera.position.x += (targetCamX - camera.position.x) * 0.1;
                camera.position.y = 7;
                camera.position.z += (targetCamZ - camera.position.z) * 0.1;
                camera.lookAt(vehicleState.pos.x, 1, vehicleState.pos.z);

                // Field work collision & progress detection
                if (Math.abs(vehicleState.speed) > 0.02) {
                    checkFieldWork(activeObj.position);
                }
            }
        }

        function checkFieldWork(pos) {
            let processedCount = 0;
            fieldBlocks.forEach(block => {
                const dist = block.position.distanceTo(pos);
                if (dist < 3.0) {
                    if (currentLevel === 1 && !block.userData.plowed) {
                        block.userData.plowed = true;
                        block.material.color.setHex(0x5c3a21); // Darker plowed soil
                        coins += 2;
                    } else if (currentLevel === 2 && block.userData.plowed && !block.userData.harrowed) {
                        block.userData.harrowed = true;
                        block.material.color.setHex(0x6b4423); // Refined fine soil
                        coins += 3;
                    } else if (currentLevel === 3 && !block.userData.harvested) {
                        block.userData.harvested = true;
                        block.material.color.setHex(0xd97706); // Golden harvested
                        coins += 5;
                    }
                }
                if (block.userData.plowed || block.userData.harrowed || block.userData.harvested) {
                    processedCount++;
                }
            });

            progress = Math.round((processedCount / fieldBlocks.length) * 100);
            document.getElementById('progress-val').innerText = progress + '%';
            document.getElementById('coins-val').innerText = coins + ' 🌾';

            if (progress >= 100 && !window.levelCompletedShown) {
                window.levelCompletedShown = true;
                showModal();
            }
        }

        function showModal() {
            document.getElementById('message-modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('message-modal').classList.add('hidden');
            window.levelCompletedShown = false;
            nextLevel();
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            updateGame();
            renderer.render(scene, camera);
        }

        window.onload = init;
    </script>
</body>
