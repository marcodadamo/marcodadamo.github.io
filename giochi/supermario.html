<script>
/* ========================================================================
   1. SINTETIZZATORE AUDIO NATIVO (Web Audio API)
   ======================================================================== */
class SoundEngine {
    constructor() {
        this.ctx = null;
    }

    init() {
        if (!this.ctx) {
            this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (this.ctx.state === 'suspended') {
            this.ctx.resume();
        }
    }

    playTone(freq, type, duration, vol = 0.1) {
        this.init();
        if (!this.ctx) return;
        try {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
            gain.gain.setValueAtTime(vol, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + duration);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start();
            osc.stop(this.ctx.currentTime + duration);
        } catch (e) {}
    }

    playJump() {
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(180, now);
        osc.frequency.exponentialRampToValueAtTime(700, now + 0.18);
        gain.gain.setValueAtTime(0.15, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.18);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.18);
    }

    playCoin() {
        this.init();
        this.playTone(987.77, 'sine', 0.08, 0.15);
        setTimeout(() => this.playTone(1318.51, 'sine', 0.25, 0.15), 80);
    }

    playBlock() {
        this.init();
        this.playTone(200, 'square', 0.1, 0.2);
    }

    playStomp() {
        this.init();
        this.playTone(120, 'triangle', 0.1, 0.25);
    }

    playWin() {
        this.init();
        const notes = [261, 329, 392, 523, 659, 783];
        notes.forEach((freq, idx) => {
            setTimeout(() => this.playTone(freq, 'triangle', 0.2, 0.2), idx * 100);
        });
    }

    playGameOver() {
        this.init();
        const notes = [400, 350, 300, 250];
        notes.forEach((freq, idx) => {
            setTimeout(() => this.playTone(freq, 'sawtooth', 0.2, 0.2), idx * 120);
        });
    }
}

/* ========================================================================
   3. INIZIALIZZAZIONE SCENA THREE.JS
   ======================================================================== */
function initEngine() {
    const canvas = document.getElementById('canvas3d');
    
    scene = new THREE.Scene();
    
    camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 4, 14);

    renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;

    // Luci
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.65);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 0.85);
    dirLight.position.set(10, 20, 15);
    dirLight.castShadow = true;
    scene.add(dirLight);

    window.addEventListener('resize', onWindowResize);
}

function onWindowResize() {
    if (!camera || !renderer) return;
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
}

function createBlockTexture(type) {
    const canvas = document.createElement('canvas');
    canvas.width = 128;
    canvas.height = 128;
    const ctx = canvas.getContext('2d');

    if (type === 'question') {
        ctx.fillStyle = '#f59e0b';
        ctx.fillRect(0, 0, 128, 128);
        ctx.fillStyle = '#d97706';
        ctx.fillRect(4, 4, 120, 120);
        ctx.fillStyle = '#fbbf24';
        ctx.fillRect(8, 8, 112, 112);
        
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 80px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('?', 64, 64);
    }
    return new THREE.CanvasTexture(canvas);
}

function buildWorld(worldType) {
    // Pulizia scena precedente
    platforms.forEach(p => scene.remove(p));
    coins.forEach(c => scene.remove(c.mesh));
    blocks.forEach(b => scene.remove(b.mesh));
    enemies.forEach(e => scene.remove(e.mesh));
    firebars.forEach(f => scene.remove(f.group));
    thwomps.forEach(t => scene.remove(t.mesh));
    piranhas.forEach(p => scene.remove(p.mesh));
    if (goalFlag) scene.remove(goalFlag);

    platforms = []; coins = []; blocks = []; enemies = []; firebars = []; thwomps = []; piranhas = [];

    let bgSky = 0x60a5fa;
    let groundColor = 0x22c55e;
    let platformColor = 0x854d0e;

    if (worldType === 'lava') {
        bgSky = 0x450a0a;
        groundColor = 0xd97706;
        platformColor = 0x78350f;
    } else if (worldType === 'castle') {
        bgSky = 0x111827;
        groundColor = 0x374151;
        platformColor = 0x1f2937;
    }

    scene.background = new THREE.Color(bgSky);

    // Piattaforma Iniziale
    const groundGeo = new THREE.BoxGeometry(40, 2, 4);
    const groundMat = new THREE.MeshLambertMaterial({ color: groundColor });
    const startPlatform = new THREE.Mesh(groundGeo, groundMat);
    startPlatform.position.set(0, -1, 0);
    scene.add(startPlatform);
    platforms.push(startPlatform);

    // Piattaforme Sospese
    const platformPositions = [
        { x: 12, y: 1, w: 8 },
        { x: 24, y: 3, w: 6 },
        { x: 34, y: 1, w: 8 },
        { x: 46, y: 4, w: 10 },
        { x: 60, y: 2, w: 12 }
    ];

    platformPositions.forEach(pos => {
        const pGeo = new THREE.BoxGeometry(pos.w, 1.5, 4);
        const pMat = new THREE.MeshLambertMaterial({ color: platformColor });
        const pMesh = new THREE.Mesh(pGeo, pMat);
        pMesh.position.set(pos.x, pos.y, 0);
        scene.add(pMesh);
        platforms.push(pMesh);
    });

    if (worldType !== 'grass') {
        const lavaGeo = new THREE.BoxGeometry(100, 1, 10);
        const lavaMat = new THREE.MeshBasicMaterial({ color: 0xef4444 });
        const lava = new THREE.Mesh(lavaGeo, lavaMat);
        lava.position.set(30, -5, 0);
        scene.add(lava);
    }

    // Monete 3D
    const coinGeo = new THREE.CylinderGeometry(0.4, 0.4, 0.1, 16);
    const coinMat = new THREE.MeshStandardMaterial({ color: 0xfacc15, metalness: 0.8, roughness: 0.2 });

    const coinCoords = [
        { x: 3, y: 1.5 }, { x: 5, y: 1.5 }, { x: 7, y: 1.5 },
        { x: 12, y: 3.2 }, { x: 14, y: 3.2 },
        { x: 24, y: 5.2 }, { x: 26, y: 5.2 },
        { x: 34, y: 3.2 }, { x: 36, y: 3.2 },
        { x: 46, y: 6.2 }, { x: 48, y: 6.2 }
    ];

    coinCoords.forEach(c => {
        const mesh = new THREE.Mesh(coinGeo, coinMat);
        mesh.rotation.x = Math.PI / 2;
        mesh.position.set(c.x, c.y, 0);
        scene.add(mesh);
        coins.push({ mesh, active: true });
    });

    // Blocchi Sorpresa [?]
    const qTex = createBlockTexture('question');
    const qMat = new THREE.MeshLambertMaterial({ map: qTex });
    const blockGeo = new THREE.BoxGeometry(1, 1, 1);

    const blockPositions = [
        { x: 4, y: 3.5 }, { x: 13, y: 4.5 }, { x: 25, y: 6.5 }, { x: 47, y: 7.5 }
    ];

    blockPositions.forEach(bp => {
        const mesh = new THREE.Mesh(blockGeo, qMat);
        mesh.position.set(bp.x, bp.y, 0);
        scene.add(mesh);
        blocks.push({ mesh, active: true });

    // Goomba
    const goombaGeo = new THREE.BoxGeometry(0.8, 0.7, 0.8);
    const goombaMat = new THREE.MeshLambertMaterial({ color: 0x78350f });

        mesh.position.set(ex, 0.35, 0);

    const flagGeo = new THREE.BoxGeometry(1.2, 0.8, 0.1);
    const flagMat = new THREE.MeshLambertMaterial({ color: 0xfacc15 });
    const flag = new THREE.Mesh(flagGeo, flagMat);
    flag.position.set(62.6, 5.5, 0);

    goalFlag = new THREE.Group();
    goalFlag.add(pole);
    goalFlag.add(flag);
    scene.add(goalFlag);
}

/* ==========================================================================
   7. GESTIONE CONTROLLI E INPUT OTTIMIZZATA
   ========================================================================== */
function setupControls() {
    window.addEventListener('keydown', (e) => {
        sounds.init();
        if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = true;
        if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = true;
        if (e.key === 'ArrowUp' || e.key === ' ' || e.key === 'w' || e.key === 'W') {
            if (!keys.jump) {
                jumpRequested = true;
            }
            keys.jump = true;
        }
    });

    window.addEventListener('keyup', (e) => {
        if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = false;
        if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = false;
        if (e.key === 'ArrowUp' || e.key === ' ' || e.key === 'w' || e.key === 'W') keys.jump = false;
    });

    // Touch Controls Reattivi
    const btnLeft = document.getElementById('btn-left');
    const btnRight = document.getElementById('btn-right');
    const btnJump = document.getElementById('btn-jump');

    const handleTouchStart = (keyName, isJump = false) => {
        sounds.init();
        keys[keyName] = true;
        if (isJump) {
            jumpRequested = true;
        }
    };

    const handleTouchEnd = (keyName) => {
        keys[keyName] = false;
    };

    btnLeft.addEventListener('touchstart', (e) => { e.preventDefault(); handleTouchStart('left'); }, {passive: false});
    btnLeft.addEventListener('touchend', (e) => { e.preventDefault(); handleTouchEnd('left'); }, {passive: false});

    btnRight.addEventListener('touchstart', (e) => { e.preventDefault(); handleTouchStart('right'); }, {passive: false});
    btnRight.addEventListener('touchend', (e) => { e.preventDefault(); handleTouchEnd('right'); }, {passive: false});

    btnJump.addEventListener('touchstart', (e) => { e.preventDefault(); handleTouchStart('jump', true); }, {passive: false});
    btnJump.addEventListener('touchend', (e) => { e.preventDefault(); handleTouchEnd('jump'); }, {passive: false});
}

function updatePhysics() {
    if (!isPlaying || isGameOver) return;

    // Movimento Orizzontale
    if (keys.left) {
        mario.position.x -= MARIO_SPEED;
        mario.rotation.y = -Math.PI / 2;
    }
    if (keys.right) {
        mario.position.x += MARIO_SPEED;
        mario.rotation.y = Math.PI / 2;
    }

    // Gestione Salto Immediato e Affidabile
    if ((jumpRequested || keys.jump) && isGrounded) {
        marioVelocityY = 0.38;
        isGrounded = false;
        jumpRequested = false;
        sounds.playJump();
    }
    jumpRequested = false; // Reset input singolo frame

    // Gravità
    marioVelocityY += GRAVITY;
    mario.position.y += marioVelocityY;

    // Collisione con le Piattaforme
    isGrounded = false;
    platforms.forEach(p => {
        const pBox = new THREE.Box3().setFromObject(p);
        const marioBox = new THREE.Box3().setFromObject(mario);

        if (marioBox.intersectsBox(pBox)) {
            if (marioVelocityY <= 0 && mario.position.y >= p.position.y) {
                mario.position.y = p.position.y + 0.75 + 0.35;
                marioVelocityY = 0;
                isGrounded = true;
            }
        }
    });

    // Raccolta Monete
    coins.forEach(c => {
        if (c.active) {
            c.mesh.rotation.z += 0.05;
            if (mario.position.distanceTo(c.mesh.position) < 0.9) {
                c.active = false;
                scene.remove(c.mesh);
                addScore(50);
                sounds.playCoin();
            }
        }
    });

    // Collisione Blocchi [?]
    blocks.forEach(b => {
        if (b.active) {
            const dist = mario.position.distanceTo(b.mesh.position);
            if (dist < 0.95 && marioVelocityY > 0 && mario.position.y < b.mesh.position.y) {
                b.active = false;
                b.mesh.material.color.setHex(0x6b7280);
                marioVelocityY = -0.1;
                addScore(100);
                sounds.playBlock();
            }
        }
    });

    // Scontro con Goomba
    enemies.forEach(e => {
        if (e.active) {
            e.mesh.position.x += 0.03 * e.dir;
            if (Math.abs(e.mesh.position.x - e.startX) > 2) e.dir *= -1;

            const dist = mario.position.distanceTo(e.mesh.position);
            if (dist < 0.9) {
                if (marioVelocityY < 0 && mario.position.y > e.mesh.position.y + 0.2) {
                    e.active = false;
                    scene.remove(e.mesh);
                    marioVelocityY = 0.26;
                    addScore(200);
                    sounds.playStomp();
                } else {
                    takeDamage();
                }
            }
        }
    });

    // Ostacoli Avanzati
    firebars.forEach(f => {
        f.angle += 0.04;
        f.group.rotation.z = f.angle;
        f.group.children.forEach(child => {
            const worldPos = new THREE.Vector3();
            child.getWorldPosition(worldPos);
            if (mario.position.distanceTo(worldPos) < 0.6) {
                takeDamage();
            }
        });
    });

    piranhas.forEach(p => {
        p.mesh.position.y = p.startY + Math.sin(Date.now() * 0.003) * 0.6;
        if (mario.position.distanceTo(p.mesh.position) < 0.8) {
            takeDamage();
        }
    });

    thwomps.forEach(t => {
        if (t.state === 'idle' && Math.abs(mario.position.x - t.mesh.position.x) < 2) {
            t.state = 'falling';
        } else if (t.state === 'falling') {
            t.mesh.position.y -= 0.22;
            if (t.mesh.position.y <= 1.5) t.state = 'rising';
        } else if (t.state === 'rising') {
            t.mesh.position.y += 0.04;
            if (t.mesh.position.y >= t.startY) t.state = 'idle';
        }

        if (mario.position.distanceTo(t.mesh.position) < 1.1) {
            takeDamage();
        }
    });

    // Telecamera che segue Mario
    camera.position.x = mario.position.x + 2;

    // Caduta nel vuoto
    if (mario.position.y < -6) {
        takeDamage(true);
    }

    // Traguardo finale
    if (goalFlag && mario.position.x >= goalFlag.position.x - 0.5) {
        if (score >= 1000) {
            winGame();
        }
    }
}

/* ========================================================================
   9. INTERFACCIA UTENTE E GESTIONE PUNTEGGIO
   ======================================================================== */
function addScore(pts) {
    score += pts;
    document.getElementById('score-text').innerText = `${score} / 1000`;
    const pct = Math.min(100, (score / 1000) * 100);
    document.getElementById('progress-bar').style.width = `${pct}%`;
}

function takeDamage(instantKill = false) {
    if (instantKill) {
        lives = 0;
    } else {
        lives--;
        mario.position.x -= 1.5;
        marioVelocityY = 0.2;
    }

    updateLivesUI();

    if (lives <= 0) {
        gameOver();
    }
}

function updateLivesUI() {
    const container = document.getElementById('lives-container');
    let hearts = '';
    for (let i = 0; i < lives; i++) hearts += '❤️';
    container.innerHTML = hearts || '💀';
}

function selectWorld(w) {
    selectedWorld = w;
    document.querySelectorAll('.world-btn').forEach(btn => {
        btn.classList.remove('border-yellow-400', 'bg-yellow-500/40');
        btn.classList.add('border-transparent', 'bg-white/10');
    });
    const selectedBtn = document.getElementById(`btn-world-${w}`);
    selectedBtn.classList.remove('border-transparent', 'bg-white/10');
    selectedBtn.classList.add('border-yellow-400', 'bg-yellow-500/40');
}

function startGame() {
    sounds.init();
    document.getElementById('menu-overlay').classList.add('hidden');
    document.getElementById('hud').classList.remove('hidden');
    document.getElementById('mobile-controls').classList.remove('hidden');

    score = 0;
    lives = 3;
    isGameOver = false;
    isPlaying = true;
    addScore(0);
    updateLivesUI();

    buildWorld(selectedWorld);

    if (mario) scene.remove(mario);
    mario = createMario();
    mario.position.set(0, 1, 0);
    scene.add(mario);
}

function winGame() {
    isPlaying = false;
    sounds.playWin();
    document.getElementById('end-title').innerText = 'VITTORIA!';
    document.getElementById('end-msg').innerText = 'SUPER TITO. Complimenti! Hai raggiunto 1000 Punti e completato il livello!';
    document.getElementById('final-score').innerText = `${score} Punti`;
    document.getElementById('end-overlay').classList.remove('hidden');
}

function gameOver() {
    isPlaying = false;
    isGameOver = true;
    sounds.playGameOver();
    document.getElementById('end-title').innerText = 'GAME OVER';
    document.getElementById('end-msg').innerText = 'Hai esaurito le vite. Riprova di nuovo!';
    document.getElementById('final-score').innerText = `${score} Punti`;
    document.getElementById('end-overlay').classList.remove('hidden');
}

function restartGame() {
    document.getElementById('end-overlay').classList.add('hidden');
    startGame();
}

/* ========================================================================
   10. LOOP DI RENDERING ANIMAZIONE
   ======================================================================== */
function animate() {
    requestAnimationFrame(animate);
    updatePhysics();
    if (renderer && scene && camera) {
        renderer.render(scene, camera);
    }
}

window.onload = function() {
    initEngine();
    setupControls();
    animate();
};
</script>
</body>
</html>
