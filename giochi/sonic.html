<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Mini Sonic</title>

<style>
body{
    margin:0;
    overflow:hidden;
    background:#87CEEB;
    touch-action:none;
}

canvas{
    display:block;
}

#hud{
    position:fixed;
    top:10px;
    left:10px;
    color:white;
    font-family:Arial;
    font-size:24px;
    font-weight:bold;
    text-shadow:2px 2px 4px black;
    z-index:100;
}

#controls{
    position:fixed;
    bottom:20px;
    width:100%;
    display:flex;
    justify-content:space-between;
    pointer-events:none;
}

.side{
    display:flex;
    gap:15px;
    padding:20px;
    pointer-events:auto;
}

.btn{
    width:80px;
    height:80px;
    border:none;
    border-radius:50%;
    font-size:30px;
    font-weight:bold;
    background:rgba(255,255,255,0.85);
    box-shadow:0 0 10px rgba(0,0,0,.4);
}

.btn:active{
    transform:scale(0.95);
}
</style>
</head>

<body>

<div id="hud">Anelli: 0</div>

<canvas id="game"></canvas>

<div id="controls">

    <div class="side">
        <button class="btn" id="left">◀</button>
        <button class="btn" id="right">▶</button>
    </div>

    <div class="side">
        <button class="btn" id="jump">▲</button>
    </div>

</div>

<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

function resize(){
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}

resize();
window.addEventListener("resize", resize);

const keys = {};

document.addEventListener("keydown", e => keys[e.code] = true);
document.addEventListener("keyup", e => keys[e.code] = false);

const touch = {
    left:false,
    right:false,
    jump:false
};

function bind(id,key){

    const btn = document.getElementById(id);

    btn.addEventListener("touchstart",e=>{
        e.preventDefault();
        touch[key]=true;
    });

    btn.addEventListener("touchend",e=>{
        e.preventDefault();
        touch[key]=false;
    });

    btn.addEventListener("touchcancel",e=>{
        e.preventDefault();
        touch[key]=false;
    });
}

bind("left","left");
bind("right","right");
bind("jump","jump");

const player = {
    x:100,
    y:100,
    w:40,
    h:40,
    vx:0,
    vy:0,
    rings:0
};

const gravity = 0.7;
const worldWidth = 5000;

let cameraX = 0;
let gameWon = false;

const goal = {
    x:4800,
    y:380,
    w:40,
    h:120
};

const platforms = [

    {x:0,y:500,w:5000,h:100},

    {x:600,y:420,w:250,h:20},
    {x:1000,y:350,w:250,h:20},
    {x:1500,y:280,w:250,h:20},
    {x:2200,y:420,w:300,h:20},
    {x:3000,y:350,w:350,h:20},
    {x:3900,y:280,w:250,h:20}

];

const rings = [];

for(let i=0;i<50;i++){

    rings.push({
        x:250+i*90,
        y:300+Math.sin(i)*50,
        collected:false
    });
}

const enemies = [

    {x:900,y:470,w:30,h:30},
    {x:1800,y:470,w:30,h:30},
    {x:2600,y:470,w:30,h:30},
    {x:3700,y:470,w:30,h:30}

];

const spriteSheet = document.createElement("canvas");
spriteSheet.width = 256;
spriteSheet.height = 64;

const sctx = spriteSheet.getContext("2d");

for(let i=0;i<4;i++){

    const x=i*64;

    sctx.fillStyle="#0066ff";
    sctx.beginPath();
    sctx.arc(x+32,30,18,0,Math.PI*2);
    sctx.fill();

    sctx.fillStyle="#0044aa";
    sctx.fillRect(x+12,20,12,12);

    sctx.fillStyle="white";
    sctx.fillRect(x+38,18,8,8);

    sctx.fillStyle="black";
    sctx.fillRect(x+41,21,3,3);

    sctx.fillStyle="red";

    if(i===0){
        sctx.fillRect(x+20,46,10,6);
        sctx.fillRect(x+36,46,10,6);
    }

    if(i===1){
        sctx.fillRect(x+14,46,12,6);
        sctx.fillRect(x+40,46,8,6);
    }

    if(i===2){
        sctx.fillRect(x+18,46,8,6);
        sctx.fillRect(x+42,46,12,6);
    }

    if(i===3){

        sctx.globalAlpha=0.3;

        sctx.beginPath();
        sctx.arc(x+18,30,18,0,Math.PI*2);
        sctx.fill();

        sctx.globalAlpha=1;

        sctx.fillRect(x+10,46,14,6);
        sctx.fillRect(x+42,46,14,6);
    }
}

let frame = 0;
let frameTimer = 0;
let facingRight = true;

function resetGame(){

    gameWon=false;

    player.x=100;
    player.y=100;
    player.vx=0;
    player.vy=0;
    player.rings=0;

    rings.forEach(r=>r.collected=false);
}

function update(){

    if(gameWon) return;

    if(keys["ArrowRight"] || touch.right){

        player.vx = 8;
        facingRight=true;

    }else if(keys["ArrowLeft"] || touch.left){

        player.vx = -8;
        facingRight=false;

    }else{

        player.vx*=0.85;
    }

    let grounded=false;

    for(let p of platforms){

        if(
            player.y+player.h>=p.y-5 &&
            player.y+player.h<=p.y+15 &&
            player.x+player.w>p.x &&
            player.x<p.x+p.w
        ){
            grounded=true;
        }
    }

    if((keys["Space"] || touch.jump) && grounded){
        player.vy=-15;
    }

    player.vy+=gravity;

    player.x+=player.vx;
    player.y+=player.vy;

    for(let p of platforms){

        if(
            player.vy>=0 &&
            player.x+player.w>p.x &&
            player.x<p.x+p.w &&
            player.y+player.h>=p.y &&
            player.y+player.h<=p.y+25
        ){
            player.y=p.y-player.h;
            player.vy=0;
        }
    }

    if(Math.abs(player.vx)>1){

        frameTimer++;

        if(frameTimer>5){

            frame=(frame+1)%4;
            frameTimer=0;

        }

    }else{
        frame=0;
    }

    rings.forEach(r=>{

        if(r.collected) return;

        const dx=(player.x+20)-r.x;
        const dy=(player.y+20)-r.y;

        if(Math.sqrt(dx*dx+dy*dy)<25){

            r.collected=true;
            player.rings++;
        }
    });

    enemies.forEach(e=>{

        if(
            player.x<e.x+e.w &&
            player.x+player.w>e.x &&
            player.y<e.y+e.h &&
            player.y+player.h>e.y
        ){
            alert("Game Over");
            resetGame();
        }
    });

    if(
        player.x < goal.x + goal.w &&
        player.x + player.w > goal.x &&
        player.y < goal.y + goal.h &&
        player.y + player.h > goal.y
    ){
        gameWon=true;
    }

    cameraX=player.x-canvas.width/3;

    if(cameraX<0)
        cameraX=0;

    document.getElementById("hud").innerText =
        "Anelli: " + player.rings;
}

function drawBackground(){

    ctx.fillStyle="#87CEEB";
    ctx.fillRect(0,0,canvas.width,canvas.height);

    ctx.fillStyle="white";

    for(let i=0;i<12;i++){

        ctx.beginPath();

        ctx.arc(
            ((i*400)-(cameraX*0.2))%6000,
            120+(i%3)*30,
            25,
            0,
            Math.PI*2
        );

        ctx.fill();
    }
}

function draw(){

    drawBackground();

    ctx.save();
    ctx.translate(-cameraX,0);

    ctx.fillStyle="#22aa22";

    platforms.forEach(p=>{
        ctx.fillRect(p.x,p.y,p.w,p.h);
    });

    rings.forEach(r=>{

        if(r.collected) return;

        ctx.strokeStyle="gold";
        ctx.lineWidth=5;

        ctx.beginPath();
        ctx.arc(r.x,r.y,12,0,Math.PI*2);
        ctx.stroke();
    });

    ctx.fillStyle="red";

    enemies.forEach(e=>{
        ctx.fillRect(e.x,e.y,e.w,e.h);
    });

    ctx.fillStyle="#666";
    ctx.fillRect(goal.x,goal.y,6,goal.h);

    ctx.fillStyle="yellow";
    ctx.fillRect(goal.x+6,goal.y,35,20);

    ctx.save();

    if(facingRight){

        ctx.drawImage(
            spriteSheet,
            frame*64,
            0,
            64,
            64,
            player.x-12,
            player.y-12,
            64,
            64
        );

    }else{

        ctx.translate(player.x+32,0);
        ctx.scale(-1,1);

        ctx.drawImage(
            spriteSheet,
            frame*64,
            0,
            64,
            64,
            -32,
            player.y-12,
            64,
            64
        );
    }

    ctx.restore();
    ctx.restore();

    if(gameWon){

        ctx.fillStyle="rgba(0,0,0,0.8)";
        ctx.fillRect(0,0,canvas.width,canvas.height);

        ctx.fillStyle="white";
        ctx.textAlign="center";

        ctx.font="50px Arial";
        ctx.fillText(
            "VITTORIA!",
            canvas.width/2,
            canvas.height/2-60
        );

        ctx.font="28px Arial";
        ctx.fillText(
            "Anelli raccolti: "+player.rings,
            canvas.width/2,
            canvas.height/2
        );

        ctx.fillText(
            "Hai completato il livello!",
            canvas.width/2,
            canvas.height/2+60
        );
    }
}

function gameLoop(){

    update();
    draw();

    requestAnimationFrame(gameLoop);
}

gameLoop();

</script>

</body>
</html>
