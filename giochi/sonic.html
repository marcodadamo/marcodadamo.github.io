<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Mini Sonic</title>

<style>
body{
    margin:0;
    overflow:hidden;
    background:#87ceeb;
}

canvas{
    display:block;
}

#info{
    position:absolute;
    top:10px;
    left:10px;
    color:white;
    font-size:24px;
    font-family:Arial;
    font-weight:bold;
}
</style>

</head>
<body>

<div id="info">Anelli: 0</div>

<canvas id="game"></canvas>

<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const keys = {};

document.addEventListener("keydown",e=>keys[e.code]=true);
document.addEventListener("keyup",e=>keys[e.code]=false);

const player = {
    x:100,
    y:200,
    w:40,
    h:40,
    vx:0,
    vy:0,
    speed:8,
    jump:-15,
    rings:0
};

const gravity = 0.7;

const worldWidth = 5000;

let cameraX = 0;

const platforms = [
    {x:0,y:500,w:5000,h:100},
    {x:500,y:420,w:200,h:20},
    {x:900,y:350,w:200,h:20},
    {x:1300,y:280,w:200,h:20},
    {x:1800,y:400,w:300,h:20}
];

const rings=[];

for(let i=0;i<40;i++){
    rings.push({
        x:250+i*100,
        y:300-Math.sin(i)*80,
        collected:false
    });
}

const enemies=[
    {x:800,y:470,w:30,h:30},
    {x:1600,y:470,w:30,h:30},
    {x:2500,y:470,w:30,h:30}
];

function resetGame(){

    player.x=100;
    player.y=200;
    player.vx=0;
    player.vy=0;
    player.rings=0;

    rings.forEach(r=>{
        r.collected=false;
    });
}

function update(){

    if(keys["ArrowRight"])
        player.vx=player.speed;

    else if(keys["ArrowLeft"])
        player.vx=-player.speed;

    else
        player.vx*=0.8;

    player.vy+=gravity;

    if(keys["Space"]){

        let grounded=false;

        for(let p of platforms){

            if(
                player.y+player.h>=p.y-5 &&
                player.y+player.h<=p.y+10 &&
                player.x+player.w>p.x &&
                player.x<p.x+p.w
            ){
                grounded=true;
            }
        }

        if(grounded){
            player.vy=player.jump;
        }
    }

    player.x+=player.vx;
    player.y+=player.vy;

    for(let p of platforms){

        if(
            player.vy>=0 &&
            player.x+player.w>p.x &&
            player.x<p.x+p.w &&
            player.y+player.h>=p.y &&
            player.y+player.h<=p.y+20
        ){
            player.y=p.y-player.h;
            player.vy=0;
        }
    }

    rings.forEach(r=>{

        if(r.collected) return;

        let dx=(player.x+20)-r.x;
        let dy=(player.y+20)-r.y;

        if(Math.sqrt(dx*dx+dy*dy)<30){
            r.collected=true;
            player.rings++;
        }
    });

    enemies.forEach(e=>{

        if(
            player.x<e.x+e.w &&
            player.x+player.w>e.x &&
            player.y<e.y+e.h &&
            player.y+player.h>e.y
        ){
            alert("Game Over!");
            resetGame();
        }

    });

    cameraX=player.x-canvas.width/3;

    document.getElementById("info").innerText =
        "Anelli: "+player.rings;
}

function draw(){

    ctx.clearRect(0,0,canvas.width,canvas.height);

    ctx.save();

    ctx.translate(-cameraX,0);

    ctx.fillStyle="green";
    platforms.forEach(p=>{
        ctx.fillRect(p.x,p.y,p.w,p.h);
    });

    rings.forEach(r=>{

        if(r.collected) return;

        ctx.beginPath();
        ctx.strokeStyle="gold";
        ctx.lineWidth=5;
        ctx.arc(r.x,r.y,12,0,Math.PI*2);
        ctx.stroke();
    });

    ctx.fillStyle="red";

    enemies.forEach(e=>{
        ctx.fillRect(e.x,e.y,e.w,e.h);
    });

    ctx.fillStyle="blue";

    ctx.beginPath();
    ctx.arc(
        player.x+20,
        player.y+20,
        20,
        0,
        Math.PI*2
    );
    ctx.fill();

    ctx.restore();
}

function loop(){

    update();
    draw();
    requestAnimationFrame(loop);
}

loop();

</script>

</body>
</html>
