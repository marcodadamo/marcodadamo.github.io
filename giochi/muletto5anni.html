    <!-- GAME CODE -->
    <script>
        // --- WEB AUDIO API SOUND SYSTEM ---
        class SoundFX {
            constructor() {
                this.ctx = null;
                this.muted = false;
                this.engineOsc = null;
                this.engineGain = null;
            }

            init() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioContext();
                    this.startEngineSound();
                }
                if (this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            startEngineSound() {
                if (this.muted || !this.ctx) return;
                try {
                    this.engineOsc = this.ctx.createOscillator();
                    this.engineGain = this.ctx.createGain();

                    this.engineOsc.type = 'sawtooth';
                    this.engineOsc.frequency.setValueAtTime(50, this.ctx.currentTime);

                    const filter = this.ctx.createBiquadFilter();
                    filter.type = 'lowpass';
                    filter.frequency.setValueAtTime(180, this.ctx.currentTime);

                    this.engineGain.gain.setValueAtTime(0.025, this.ctx.currentTime);

                    this.engineOsc.connect(filter);
                    filter.connect(this.engineGain);
                    this.engineGain.connect(this.ctx.destination);

                    this.engineOsc.start();
                } catch (e) {}
            }

            setEngineSpeed(moving) {
                if (!this.ctx || this.muted || !this.engineOsc) return;
                const now = this.ctx.currentTime;
                if (moving) {
                    this.engineOsc.frequency.setTargetAtTime(95, now, 0.1);
                    this.engineGain.gain.setTargetAtTime(0.06, now, 0.1);
                } else {
                    this.engineOsc.frequency.setTargetAtTime(50, now, 0.1);
                    this.engineGain.gain.setTargetAtTime(0.025, now, 0.1);
                }
            }

            playBeep() {
                if (this.muted || !this.ctx) return;
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                osc.type = 'sine';
                osc.frequency.setValueAtTime(850, now);

                gain.gain.setValueAtTime(0.08, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);

                osc.connect(gain);
                gain.connect(this.ctx.destination);

                osc.start(now);
                osc.stop(now + 0.12);
            }

            playForkSound(lifting) {
                if (this.muted || !this.ctx) return;
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                osc.type = 'triangle';
                const startFreq = lifting ? 220 : 400;
                const endFreq = lifting ? 450 : 200;

                osc.frequency.setValueAtTime(startFreq, now);
                osc.frequency.linearRampToValueAtTime(endFreq, now + 0.35);

                gain.gain.setValueAtTime(0.1, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.35);

                osc.connect(gain);
                gain.connect(this.ctx.destination);

                osc.start(now);
                osc.stop(now + 0.35);
            }

            playPickup() {
                if (this.muted || !this.ctx) return;
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                osc.type = 'sine';
                osc.frequency.setValueAtTime(320, now);
                osc.frequency.exponentialRampToValueAtTime(750, now + 0.14);

                gain.gain.setValueAtTime(0.18, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.14);

                osc.connect(gain);
                gain.connect(this.ctx.destination);

                osc.start(now);
                osc.stop(now + 0.14);
            }

            playSuccess() {
                if (this.muted || !this.ctx) return;
                const notes = [523.25, 659.25, 783.99, 1046.50];
                notes.forEach((freq, idx) => {
                    const now = this.ctx.currentTime + idx * 0.09;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();

                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, now);

                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);

                    osc.connect(gain);
                    gain.connect(this.ctx.destination);

                    osc.start(now);
                    osc.stop(now + 0.3);
                });
            }

            playLevelWin() {
                if (this.muted || !this.ctx) return;
                const notes = [392, 523, 659, 783, 1046];
                notes.forEach((freq, idx) => {
                    const now = this.ctx.currentTime + idx * 0.12;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();

                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, now);

                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.45);

                    osc.connect(gain);
                    gain.connect(this.ctx.destination);

                    osc.start(now);
                    osc.stop(now + 0.45);
                });
            }
        }

        const soundFX = new SoundFX();

        function toggleAudio() {
            soundFX.muted = !soundFX.muted;
            const icon = document.getElementById('soundIcon');
            const btn = document.getElementById('soundToggleBtn');
            if (soundFX.muted) {
                icon.className = "fas fa-volume-mute text-xl sm:text-2xl text-rose-700";
                btn.className = "bg-slate-300 text-slate-600 font-bold p-3 rounded-2xl border-4 border-slate-400 shadow-lg flex items-center justify-center text-lg";
                if (soundFX.engineGain) soundFX.engineGain.gain.setValueAtTime(0, soundFX.ctx.currentTime);
            } else {
                icon.className = "fas fa-volume-up text-xl sm:text-2xl";
                btn.className = "bg-amber-400 hover:bg-amber-300 text-amber-950 font-bold p-3 rounded-2xl border-4 border-amber-500 shadow-lg flex items-center justify-center text-lg";
                if (soundFX.ctx) soundFX.init();
            }
        }

        // --- PALLET COLOR DEFINITIONS ---
        const PALLET_COLORS = [
            { id: 'red', name: 'ROSSO', hex: 0xef4444, cssHex: '#ef4444' },
            { id: 'blue', name: 'BLU', hex: 0x3b82f6, cssHex: '#3b82f6' },
            { id: 'green', name: 'VERDE', hex: 0x22c55e, cssHex: '#22c55e' },
            { id: 'yellow', name: 'GIALLO', hex: 0xeab308, cssHex: '#eab308' },
            { id: 'purple', name: 'VIOLA', hex: 0xa855f7, cssHex: '#a855f7' }
        ];

        // --- GAME PLAYER STATE & CONFIG ---
        let playerName = "Campione";
        let playerAvatar = "🐻";
        let selectedLevel = 1;
        let isTimedMode = false;
        let timerSeconds = 60;
        let timerInterval = null;

        // --- THREE.JS SCENE VARIABLES ---
        let scene, camera, renderer;
        let forkliftGroup, forkCarriage, steeringWheels = [];
        let pallets = [], trucks = [], environmentDecorations = [];
        let targetHighlightMesh = null;
        let guideArrowMesh = null;

        let score = 0;
        let keys = { ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false };
        let touchState = { up: false, down: false, left: false, right: false };

        let forkliftState = {
            x: -8,
            z: 0,
            angle: 0,
            speed: 0,
            maxSpeed: 0.16,
            acceleration: 0.008,
            friction: 0.92,
            steeringAngle: 0,
            maxSteering: 0.04,
            forkLifted: false,
            forkHeight: 0,
            loadedPallet: null
        };

        let currentTargetColor = null;
        let backupBeepTimer = 0;

        // --- PLAYER REGISTRATION & NAVIGATION LOGIC ---
        function selectAvatar(avatar) {
            playerAvatar = avatar;
            document.querySelectorAll('.avatar-opt').forEach(btn => {
                btn.classList.remove('selected');
                if (btn.innerText === avatar) btn.classList.add('selected');

        // --- GAME LOOP & LOGIC ---
        function initGame() {
            soundFX.init();

        function startNewLevel() {
            document.getElementById('victoryOverlay').classList.add('hidden');
            document.getElementById('timeOutOverlay').classList.add('hidden');

            forkliftState.x = -8;
            forkliftState.z = 0;
            forkliftState.angle = 0;
            forkliftState.speed = 0;
            forkliftState.forkLifted = false;
            forkliftState.forkHeight = 0;
            forkliftState.loadedPallet = null;

            updateForkliftMeshPosition();
            updateForkButtonUI();

            pallets.forEach(p => scene.remove(p.mesh));
            trucks.forEach(t => scene.remove(t.mesh));
            pallets = [];
            trucks = [];

            // Spawn number of pallets based on selected level (Level 1 = 1, Level 5 = 5)
            const count = selectedLevel;
            const shuffled = [...PALLET_COLORS].sort(() => 0.5 - Math.random());
            const activeColors = shuffled.slice(0, count);

            activeColors.forEach((color, i) => {
                const pMesh = createPalletMesh(color);
                const px = -2 + Math.random() * 3;
                const pz = -10 + (i * (20 / Math.max(count, 2))) + (Math.random() * 2 - 1);

                pMesh.position.set(px, 0, pz);
                scene.add(pMesh);

                pallets.push({
                    color: color,
                    mesh: pMesh,
                    x: px,
                    z: pz,
                    delivered: false
                });
            });

            const truckX = 14;
            activeColors.forEach((color, i) => {
                const tMesh = createTruckMesh(color);
                const tz = -10 + (i * (20 / Math.max(count, 2)));
                tMesh.position.set(truckX, 0, tz);
                scene.add(tMesh);

                trucks.push({
                    color: color,
                    mesh: tMesh,
                    x: truckX,
                    z: tz,
                    loaded: false
                });
            });

            // Timed Mode Timer setup
            clearInterval(timerInterval);
            const timerDisplay = document.getElementById('timerDisplay');
            if (isTimedMode) {
                timerSeconds = 30 + (selectedLevel * 15); // e.g. Level 1 = 45s, Level 5 = 105s
                document.getElementById('timerText').innerText = timerSeconds;
                timerDisplay.classList.remove('hidden');

                timerInterval = setInterval(() => {
                    timerSeconds--;
                    document.getElementById('timerText').innerText = timerSeconds;
                    if (timerSeconds <= 0) {
                        clearInterval(timerInterval);
                        triggerTimeOut();
                    }
                }, 1000);
            } else {
                timerDisplay.classList.add('hidden');
            }

            pickNextTarget();
        }

        function pickNextTarget() {
            const remaining = pallets.filter(p => !p.delivered);
            if (remaining.length > 0) {
                if (forkliftState.loadedPallet) {
                    currentTargetColor = forkliftState.loadedPallet.color;
                    updateInstructionBanner(`Porta il pacco al camion ${currentTargetColor.name}!`);
                } else {
                    currentTargetColor = remaining[0].color;
                    updateInstructionBanner(`Dai ${playerName}, carica il pacco ${currentTargetColor.name}!`);
                }
            } else {
                triggerLevelWin();
            }
        }

        // --- UPDATE & PHYSICS ---
        function updateGameLogic() {
            const isUp = keys.ArrowUp || touchState.up;
            const isDown = keys.ArrowDown || touchState.down;
            const isLeft = keys.ArrowLeft || touchState.left;
            const isRight = keys.ArrowRight || touchState.right;

            soundFX.setEngineSpeed(isUp || isDown);

            if (isUp) {
                forkliftState.speed = Math.min(forkliftState.speed + forkliftState.acceleration, forkliftState.maxSpeed);
            } else if (isDown) {
                forkliftState.speed = Math.max(forkliftState.speed - forkliftState.acceleration, -forkliftState.maxSpeed * 0.6);
                backupBeepTimer++;
                if (backupBeepTimer % 22 === 0) soundFX.playBeep();
            } else {
                forkliftState.speed *= forkliftState.friction;
                if (Math.abs(forkliftState.speed) < 0.001) forkliftState.speed = 0;
            }

            if (Math.abs(forkliftState.speed) > 0.005) {
                const dir = forkliftState.speed > 0 ? 1 : -1;
                if (isLeft) forkliftState.angle += forkliftState.maxSteering * dir;
                if (isRight) forkliftState.angle -= forkliftState.maxSteering * dir;
            }

            forkliftState.x += Math.cos(forkliftState.angle) * forkliftState.speed;
            forkliftState.z -= Math.sin(forkliftState.angle) * forkliftState.speed;

            forkliftState.x = Math.max(-18, Math.min(18, forkliftState.x));
            forkliftState.z = Math.max(-15, Math.min(15, forkliftState.z));

            const targetHeight = forkliftState.forkLifted ? 1.4 : 0;
            forkliftState.forkHeight += (targetHeight - forkliftState.forkHeight) * 0.12;

            updateForkliftMeshPosition();

            if (!forkliftState.loadedPallet) {
                autoPickupCheck();
            } else {
                const forkDistance = 1.6;
                const px = forkliftState.x + Math.cos(forkliftState.angle) * forkDistance;
                const pz = forkliftState.z - Math.sin(forkliftState.angle) * forkDistance;
                forkliftState.loadedPallet.mesh.position.set(px, forkliftState.forkHeight + 0.1, pz);
                forkliftState.loadedPallet.mesh.rotation.y = forkliftState.angle;

                checkTruckDelivery();
            }

            updateTargetHighlight();

            const camOffset = new THREE.Vector3(-10, 12, 12);
            const targetCamPos = new THREE.Vector3(
                forkliftState.x + camOffset.x,
                camOffset.y,
                forkliftState.z + camOffset.z
            );
            camera.position.lerp(targetCamPos, 0.05);
            camera.lookAt(forkliftState.x, 1.5, forkliftState.z);
        }

        function updateForkliftMeshPosition() {
            forkliftGroup.position.set(forkliftState.x, 0, forkliftState.z);
            forkliftGroup.rotation.y = forkliftState.angle;
            forkCarriage.position.y = 0.3 + forkliftState.forkHeight;
        }

        function autoPickupCheck() {
            pallets.forEach(pallet => {
                if (pallet.delivered) return;
                const dist = Math.hypot(forkliftState.x - pallet.x, forkliftState.z - pallet.z);
                if (dist < 2.2) {
                    forkliftState.loadedPallet = pallet;
                    forkliftState.forkLifted = true;
                    updateForkButtonUI();
                    soundFX.playPickup();
                    showFloatingText(`Bravo ${playerName}!`);
                    pickNextTarget();
                }
            });
        }

        function tryPickUpPallet() {
            if (forkliftState.loadedPallet) return;
            pallets.forEach(pallet => {
                if (pallet.delivered) return;
                const dist = Math.hypot(forkliftState.x - pallet.x, forkliftState.z - pallet.z);
                if (dist < 3.0) {
                    forkliftState.loadedPallet = pallet;
                    soundFX.playPickup();
                    pickNextTarget();
                }
            });
        }

        function tryDropPallet() {
            if (!forkliftState.loadedPallet) return;
            forkliftState.loadedPallet = null;
            soundFX.playForkSound(false);
            pickNextTarget();
        }

        function checkTruckDelivery() {
            if (!forkliftState.loadedPallet) return;

            const pallet = forkliftState.loadedPallet;
            trucks.forEach(truck => {
                if (truck.color.id === pallet.color.id && !truck.loaded) {
                    const dist = Math.hypot(pallet.mesh.position.x - truck.x, pallet.mesh.position.z - truck.z);
                    if (dist < 3.2) {
                        pallet.delivered = true;
                        truck.loaded = true;

                        pallet.mesh.position.set(truck.x - 0.4, 0.6, truck.z);
                        pallet.mesh.rotation.y = 0;

                        forkliftState.loadedPallet = null;
                        score += 10;
                        document.getElementById('scoreText').innerText = score;

                        soundFX.playSuccess();
                        showFloatingText(`Super ${playerName}! ⭐`);
                        pickNextTarget();
                    }
                }
            });
        }

        function updateTargetHighlight() {
            if (!currentTargetColor) {
                targetHighlightMesh.visible = false;
                guideArrowMesh.visible = false;
                return;
            }

            let targetX = 0, targetZ = 0;

            if (!forkliftState.loadedPallet) {
                const targetPallet = pallets.find(p => !p.delivered && p.color.id === currentTargetColor.id);
                if (targetPallet) {
                    targetX = targetPallet.mesh.position.x;
                    targetZ = targetPallet.mesh.position.z;
                    targetHighlightMesh.position.set(targetX, 0.05, targetZ);
                    targetHighlightMesh.visible = true;
                }
            } else {
                const targetTruck = trucks.find(t => t.color.id === currentTargetColor.id);
                if (targetTruck) {
                    targetX = targetTruck.x;
                    targetZ = targetTruck.z;
                    targetHighlightMesh.position.set(targetX, 0.05, targetZ);
                    targetHighlightMesh.visible = true;
                }
            }

            // Level 1 Visual Guide Arrow pointing directly to target
            if (selectedLevel === 1 && targetHighlightMesh.visible) {
                guideArrowMesh.visible = true;
                guideArrowMesh.position.set(targetX, 2.5 + Math.sin(Date.now() * 0.005) * 0.4, targetZ);
            } else {
                guideArrowMesh.visible = false;
            }
        }

        function showFloatingText(text) {
            const banner = document.createElement('div');
            banner.className = 'fixed font-extrabold text-3xl sm:text-4xl text-amber-400 drop-shadow-lg pointer-events-none transition-all duration-1000 transform -translate-x-1/2 -translate-y-1/2 z-30 animate-bounce text-center';
            banner.style.left = '50%';
            banner.style.top = '40%';
            banner.innerText = text;
            document.body.appendChild(banner);

            setTimeout(() => {
                banner.style.transform = 'translate(-50%, -120px) scale(1.3)';
                banner.style.opacity = '0';
            }, 50);

            setTimeout(() => banner.remove(), 1050);
        }

        function triggerLevelWin() {
            clearInterval(timerInterval);
            soundFX.playLevelWin();
            confetti({
                particleCount: 120,
                spread: 80,
                origin: { y: 0.6 }
            });

            document.getElementById('victoryTitle').innerText = `SUPER ${playerName.toUpperCase()}!`;
            document.getElementById('victoryOverlay').classList.remove('hidden');
        }

        function triggerTimeOut() {
            document.getElementById('timeOutOverlay').classList.remove('hidden');
        }

        function nextLevel() {
            if (selectedLevel < 5) {
                selectedLevel++;
            }
            startSelectedGame();
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            updateGameLogic();
            renderer.render(scene, camera);
        }

        window.onload = () => {
            init3D();
            animate();
        };
    </script>
</body>
</html>
