<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Festa di Spider-Man con Tito!</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Fredoka', cursive, sans-serif;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }
        .pop-animation {
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        @keyframes popIn {
            0% { transform: scale(0); opacity: 0; }
            80% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }
        .floating {
            animation: floatMsg 1.5s ease-out forwards;
        }
        @keyframes floatMsg {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-80px) scale(1.3); opacity: 0; }
        }
        /* Custom pulse animation for big buttons */
        .btn-pulse {
            animation: pulseBtn 2s infinite;
        }
        @keyframes pulseBtn {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
    </style>
</head>
<body class="bg-gradient-to-b from-sky-400 via-sky-200 to-blue-500 h-screen w-screen overflow-hidden flex flex-col justify-between select-none">

    <header class="w-full p-3 sm:p-4 flex justify-between items-center z-10 bg-white/90 backdrop-blur-md shadow-lg rounded-b-3xl mx-auto max-w-4xl">
        <div class="flex items-center gap-2 sm:gap-3">
            <div class="bg-red-500 text-white font-bold px-3 py-2 sm:px-4 sm:py-2 rounded-2xl shadow-md text-lg sm:text-2xl flex items-center gap-2 border-4 border-yellow-300 pop-animation">
                <span>🍕</span> <span id="score">0</span>
            </div>
            <div id="encouragement" class="text-red-600 font-extrabold text-lg sm:text-2xl hidden animate-bounce drop-shadow">
                ¡Super Spidey!
            </div>
        </div>
        
        <div class="text-center flex flex-col items-center">
            <h1 class="text-lg sm:text-2xl font-black text-red-600 drop-shadow-sm tracking-wide">
                🕷️ Spider-Party 🎈
            </h1>
            <div id="heroBadge" class="hidden bg-yellow-300 text-blue-900 font-black px-3 py-1 rounded-full text-xs sm:text-base border-2 border-white shadow-sm mt-1">
                Supereroe Spidey
            </div>
        </div>

        <div class="flex items-center gap-2">
            <button id="soundBtn" onclick="toggleSound()" class="bg-yellow-400 hover:bg-yellow-500 text-red-700 font-bold p-2 sm:p-3 rounded-2xl shadow-md text-lg sm:text-xl border-4 border-white transition transform active:scale-95">
                🔊
            </button>
            <button onclick="openNameModal()" class="bg-green-500 hover:bg-green-600 text-white font-bold p-2 sm:p-3 rounded-2xl shadow-md text-lg sm:text-xl border-4 border-white transition transform active:scale-95" title="Cambia Nome">
                👤
            </button>
        </div>
    </header>

    <main class="flex-1 relative w-full max-w-4xl mx-auto overflow-hidden cursor-pointer">
        <canvas id="gameCanvas" class="absolute inset-0 w-full h-full block"></canvas>
        
        <!-- Welcome & Player Name Input Screen Overlay -->
        <div id="messageOverlay" class="absolute inset-0 flex items-center justify-center z-20 bg-sky-900/40 backdrop-blur-sm p-4">
            <div id="msgBox" class="bg-yellow-300 text-red-600 font-extrabold p-6 sm:p-8 rounded-3xl shadow-2xl border-8 border-white pop-animation text-center max-w-md w-full flex flex-col items-center gap-4">
                
                <div class="text-4xl sm:text-600 font-black text-red-600 drop-shadow">
                    🕷️ Ciao Supereroe! 🦸‍♂️
                </div>

                <div class="w-full text-left">
                    <label for="playerNameInput" class="block text-blue-900 font-bold text-base sm:text-xl mb-2 text-center">
                        Scrivi il tuo nome da Supereroe:
                    </label>
                    <input 
                        type="text" 
                        id="playerNameInput" 
                        placeholder="Es. Marco, Sofia..." 
                        maxlength="12"
                        class="w-full text-center text-2xl sm:text-3xl font-bold py-3 px-4 rounded-2xl border-4 border-red-500 bg-white text-gray-800 shadow-inner focus:outline-none focus:ring-4 focus:ring-yellow-400"
                    >
                </div>

                <button 
                    onclick="handleStartClick()" 
                    class="btn-pulse bg-red-500 hover:bg-red-600 active:bg-red-700 text-white text-2xl sm:text-3xl font-black py-4 px-8 rounded-2xl shadow-xl border-4 border-white transition transform active:scale-95 flex items-center gap-3 mt-2"
                >
                    <span>GIOCA ORA!</span>
                    <span class="text-3xl">🚀</span>
                </button>
            </div>
        </div>
    </main>

    <footer class="w-full p-4 bg-white/90 backdrop-blur-md shadow-2xl rounded-t-3xl max-w-4xl mx-auto flex justify-around items-center z-10">
        <button id="leftBtn" class="bg-red-500 hover:bg-red-600 active:bg-red-700 text-white font-black text-4xl w-24 h-16 sm:w-32 sm:h-20 rounded-3xl shadow-lg border-4 border-yellow-300 flex items-center justify-center transition transform active:scale-90">
            ⬅️
        </button>
        <div class="text-center hidden sm:block">
            <p id="footerInstruction" class="text-blue-900 font-bold text-sm">Usa le frecce per muovere Spider-Man!</p>
            <p class="text-red-500 font-semibold text-xs">Raccogli pizze, ciambelle e stelle!</p>
        </div>
        <button id="rightBtn" class="bg-red-500 hover:bg-red-600 active:bg-red-700 text-white font-black text-4xl w-24 h-16 sm:w-32 sm:h-20 rounded-3xl shadow-lg border-4 border-yellow-300 flex items-center justify-center transition transform active:scale-90">
            ➡️
        </button>
    </footer>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const encouragementEl = document.getElementById('encouragement');
        const msgBox = document.getElementById('msgBox');
        const messageOverlay = document.getElementById('messageOverlay');
        const playerNameInput = document.getElementById('playerNameInput');
        const heroBadge = document.getElementById('heroBadge');

        let playerName = "";
        let score = 0;
        let gameStarted = false;
        let soundEnabled = true;
        let animationId;

        function openNameModal() {
            gameStarted = false;
            cancelAnimationFrame(animationId);
            messageOverlay.style.display = 'flex';
            if (playerName) playerNameInput.value = playerName;
        }

        function handleStartClick() {
            let inputName = playerNameInput.value.trim();
            if (!inputName) {
                inputName = "Campione";
            }
            playerName = inputName;
            
            // Set superhero badge title
            heroBadge.innerText = `Spider-${playerName} ⚡`;
            heroBadge.classList.remove('hidden');

            startGame();
        }

        // Personalized encouragement list for 5-year-old children
        function triggerEncouragement() {
            const praises = [
                `¡Bravissimo ${playerName}!`,
                `¡Grande Spider-${playerName}!`,
                `¡Super ${playerName}!`,
                `¡Sei un mito, ${playerName}!`,
                `¡Fantastico ${playerName}!`,
                `¡Forza ${playerName}!`
            ];
            const randomMsg = praises[Math.floor(Math.random() * praises.length)];
            encouragementEl.innerText = randomMsg;
            encouragementEl.classList.remove('hidden');
            setTimeout(() => {
                encouragementEl.classList.add('hidden');
            }, 1200);
        }

        function playSound(type) {
            if (!soundEnabled) return;
            initAudio();
            if (!audioCtx) return;

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            const now = audioCtx.currentTime;

            if (type === 'collect') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.exponentialRampToValueAtTime(800, now + 0.15);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                osc.start(now);
                osc.stop(now + 0.15);
            } else if (type === 'bonus') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(500, now);
                osc.frequency.setValueAtTime(750, now + 0.1);
                osc.frequency.setValueAtTime(1000, now + 0.2);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.start(now);
                osc.stop(now + 0.3);
            } else if (type === 'start') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(250, now);
        // Audio Context Setup
        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function toggleSound() {
            soundEnabled = !soundEnabled;
            document.getElementById('soundBtn').innerText = soundEnabled ? '🔊' : '🔇';
        }

        // Resize Canvas
        function resizeCanvas() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
            if (spidey) {
                spidey.y = canvas.height - 110;
            }
        }
        window.addEventListener('resize', resizeCanvas);

        // Spider-Man Character Object
        class SpiderMan {
            constructor() {
                this.width = 90;
                this.height = 100;
                this.x = window.innerWidth / 2 - 45;
                this.y = 0; // set in resize
                this.speed = 12;
                this.vx = 0;
                this.targetX = null;
            }

            draw() {
                ctx.save();
                ctx.translate(this.x + this.width / 2, this.y + this.height / 2);

                // Chibi Spider-Man Body (Cute & Round)
                // Legs / Feet
                ctx.fillStyle = '#1e3a8a';
                ctx.beginPath();
                ctx.arc(-20, 35, 14, 0, Math.PI * 2);
                ctx.arc(20, 35, 14, 0, Math.PI * 2);
                ctx.fill();

                // Torso Suit
                ctx.fillStyle = '#dc2626';
                ctx.beginPath();
                ctx.roundRect(-25, 0, 50, 45, 12);
                ctx.fill();

                // Spider Logo on chest
                ctx.fillStyle = '#000';
                ctx.beginPath();
                ctx.arc(0, 20, 8, 0, Math.PI * 2);
                ctx.fill();

                // Arms holding web basket
                ctx.strokeStyle = '#dc2626';
                ctx.lineWidth = 10;
                ctx.lineCap = 'round';
                ctx.beginPath();
                ctx.moveTo(-20, 15);
                ctx.lineTo(-40, 25);
                ctx.moveTo(20, 15);
                ctx.lineTo(40, 25);
                ctx.stroke();

                // Huge Cute Head
                ctx.fillStyle = '#dc2626';
                ctx.beginPath();
                ctx.arc(0, -25, 38, 0, Math.PI * 2);
                ctx.fill();

                // Web lines on mask
                ctx.strokeStyle = '#991b1b';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(0, -63); ctx.lineTo(0, 13);
                ctx.moveTo(-38, -25); ctx.lineTo(38, -25);
                ctx.stroke();

                // Big Expressive White Eyes with thick black outline
                ctx.fillStyle = '#000';
                // Left Eye background
                ctx.beginPath();
                ctx.ellipse(-14, -28, 14, 9, -0.2, 0, Math.PI * 2);
                ctx.fill();
                // Right Eye background
                ctx.beginPath();
                ctx.ellipse(14, -28, 14, 9, 0.2, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.ellipse(-14, -28, 11, 6, -0.2, 0, Math.PI * 2);
                ctx.ellipse(14, -28, 11, 6, 0.2, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();
            }

            update() {
                if (this.targetX !== null) {
                    let diff = this.targetX - (this.x + this.width / 2);
                    if (Math.abs(diff) < this.speed) {
                        this.x = this.targetX - this.width / 2;
                        this.targetX = null;
                    } else {
                        this.x += Math.sign(diff) * this.speed;
                    }
                } else {
                    this.x += this.vx;
                }

                // Boundaries
                if (this.x < 10) this.x = 10;
                if (this.x > canvas.width - this.width - 10) {
                    this.x = canvas.width - this.width - 10;
                }
            }
        }

        let spidey = new SpiderMan();
        resizeCanvas();

        // Falling Items Array
        let items = [];
        let particles = [];
        const itemTypes = [
            { emoji: '🍕', type: 'pizza', points: 1, name: 'Pizza!' },
            { emoji: '🍩', type: 'donut', points: 1, name: 'Ciambella!' },
            { emoji: '⭐', type: 'star', points: 2, name: 'Stella Magica!' },
            { emoji: '❤️', type: 'heart', points: 2, name: 'Cuore!' },
            { emoji: '🎈', type: 'balloon', points: 3, name: 'Palloncino!' },
            { emoji: '🦹‍♂️', type: 'goblin', points: 5, name: 'Super Bonus Goblin!' }
        ];

        class FallingItem {
            constructor() {
                this.radius = 28;
                this.x = Math.random() * (canvas.width - 80) + 40;
                this.y = -50;
                this.speed = Math.random() * 2 + 2.5;
                const rand = Math.random();
                if (rand < 0.3) this.data = itemTypes[0]; // pizza
                else if (rand < 0.5) this.data = itemTypes[1]; // donut
                else if (rand < 0.7) this.data = itemTypes[2]; // star
                else if (rand < 0.85) this.data = itemTypes[3]; // heart
                else if (rand < 0.95) this.data = itemTypes[4]; // balloon
                else this.data = itemTypes[5]; // goblin
                this.wobble = Math.random() * Math.PI * 2;
                this.wobbleSpeed = Math.random() * 0.08 + 0.04;
            }

            draw() {
                ctx.save();
                ctx.font = '42px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                // Slight bounce effect
                let renderY = this.y + Math.sin(this.wobble) * 4;
                ctx.fillText(this.data.emoji, this.x, renderY);
                ctx.restore();
            }

            update() {
                this.y += this.speed;
                this.wobble += this.wobbleSpeed;
            }
        }

        // Floating particle effect on collection
        class Particle {
            constructor(x, y, text) {
                this.x = x;
                this.y = y;
                this.text = text;
                this.alpha = 1;
                this.vy = -3;
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.font = 'bold 26px Fredoka, sans-serif';
                ctx.fillStyle = '#fbbf24';
                ctx.strokeStyle = '#dc2626';
                ctx.lineWidth = 4;
                ctx.strokeText(this.text, this.x, this.y);
                ctx.fillText(this.text, this.x, this.y);
                ctx.restore();
            }
            update() {
                this.y += this.vy;
                this.alpha -= 0.02;
            }
        }

        // Encouragement phrases for 5yo kids
        const encouragements = [
            "¡Fantastico!", "¡Bravo Spidey!", "¡Super!", "¡Evviva!", "¡Campione!", "¡Meraviglioso!"
        ];

        function triggerEncouragement() {
            const randomMsg = encouragements[Math.floor(Math.random() * encouragements.length)];
            encouragementEl.innerText = randomMsg;
            encouragementEl.classList.remove('hidden');
            setTimeout(() => {
                encouragementEl.classList.add('hidden');
            }, 1000);
        }

        // Spawning items timer
        let spawnTimer = 0;

        function gameLoop() {
            if (!gameStarted) return;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw background decorative clouds / buildings
            ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
            ctx.beginPath();
            ctx.arc(100, 80, 50, 0, Math.PI * 2);
            ctx.arc(150, 70, 60, 0, Math.PI * 2);
            ctx.arc(200, 90, 40, 0, Math.PI * 2);
            ctx.arc(canvas.width - 120, 150, 70, 0, Math.PI * 2);
            ctx.arc(canvas.width - 60, 160, 50, 0, Math.PI * 2);
            ctx.fill();

            // Update & Draw Spiderman
            spidey.update();
            spidey.draw();

            // Spawn items
            spawnTimer++;
            if (spawnTimer > 40) {
                items.push(new FallingItem());
                spawnTimer = 0;
            }

            // Update & Draw Falling Items
            for (let i = items.length - 1; i >= 0; i--) {
                let item = items[i];
                item.update();
                item.draw();

                // Collision detection with Spider-Man
                let spideyCenterX = spidey.x + spidey.width / 2;
                let spideyCenterY = spidey.y + spidey.height / 2;
                let distX = item.x - spideyCenterX;
                let distY = item.y - spideyCenterY;
                let distance = Math.sqrt(distX * distX + distY * distY);

                if (distance < 55) {
                    // Collected!
                    score += item.data.points;
                    scoreEl.innerText = score;
                    
                    if (item.data.type === 'goblin') {
                        playSound('bonus');
                    } else {
                        playSound('collect');
                    }

                    particles.push(new Particle(item.x, item.y, `+${item.data.points} ${this.name || item.data.name}`));
                    triggerEncouragement();

                    items.splice(i, 1);
                    continue;
                }

                // Remove off-screen items
                if (item.y > canvas.height + 50) {
                    items.splice(i, 1);
                }
            }

            // Update & Draw Particles
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.update();
                p.draw();
                if (p.alpha <= 0) {
                    particles.splice(i, 1);
                }
            }

            animationId = requestAnimationFrame(gameLoop);
        }

        // Start / Reset Game
        function startGame() {
            initAudio();
            playSound('start');
            gameStarted = true;
            messageOverlay.style.display = 'none';
            score = 0;
            scoreEl.innerText = score;
            items = [];
            particles = [];
            spidey.y = canvas.height - 110;
            spidey.x = canvas.width / 2 - spidey.width / 2;
            cancelAnimationFrame(animationId);
            gameLoop();
        }

        function resetGame() {
            openNameModal();
        }

        // Controls: Keyboard
        window.addEventListener('keydown', (e) => {
            if (!gameStarted && messageOverlay.style.display === 'none') startGame();
            if (e.key === 'ArrowLeft') spidey.vx = -12;
            if (e.key === 'ArrowRight') spidey.vx = 12;
            if (e.key === 'Enter' && messageOverlay.style.display !== 'none') {
                handleStartClick();
            }
        });

        window.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowLeft' && spidey.vx < 0) spidey.vx = 0;
            if (e.key === 'ArrowRight' && spidey.vx > 0) spidey.vx = 0;
        });

        // Controls: On-screen buttons
        const leftBtn = document.getElementById('leftBtn');
        const rightBtn = document.getElementById('rightBtn');

        const pressLeft = (e) => { e.preventDefault(); if (!gameStarted && messageOverlay.style.display === 'none') startGame(); spidey.vx = -12; };
        const releaseLeft = (e) => { e.preventDefault(); if (spidey.vx < 0) spidey.vx = 0; };
        const pressRight = (e) => { e.preventDefault(); if (!gameStarted && messageOverlay.style.display === 'none') startGame(); spidey.vx = 12; };
        const releaseRight = (e) => { e.preventDefault(); if (spidey.vx > 0) spidey.vx = 0; };

        leftBtn.addEventListener('mousedown', pressLeft);
        leftBtn.addEventListener('mouseup', releaseLeft);
        leftBtn.addEventListener('touchstart', pressLeft);
        leftBtn.addEventListener('touchend', releaseLeft);

        rightBtn.addEventListener('mousedown', pressRight);
        rightBtn.addEventListener('mouseup', releaseRight);
        rightBtn.addEventListener('touchstart', pressRight);
        rightBtn.addEventListener('touchend', releaseRight);

        // Controls: Mouse / Touch drag on canvas
        canvas.addEventListener('mousemove', (e) => {
            if (!gameStarted) return;
            const rect = canvas.getBoundingClientRect();
            spidey.targetX = e.clientX - rect.left;
        });

        canvas.addEventListener('touchmove', (e) => {
            if (!gameStarted) return;
            const rect = canvas.getBoundingClientRect();
            spidey.targetX = e.touches[0].clientX - rect.left;
            e.preventDefault();
        }, { passive: false });

        // Initial render before start
        spidey.y = canvas.height - 110;
        spidey.draw();
    </script>
</body>
</html>
```
