<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Fredoka', cursive, sans-serif;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
            overflow: hidden;
        }
        .pop-in {
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }

            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        .float-anim {
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0px); }

        }
    </style>
</head>
<body class="bg-gradient-to-b from-sky-400 via-sky-300 to-blue-600 h-screen w-screen flex flex-col justify-between">

    <header class="w-full p-3 sm:p-4 flex justify-between items-center z-10 bg-white/90 backdrop-blur-md shadow-lg rounded-b-3xl mx-auto max-w-4xl">
        <div class="flex items-center gap-2">

                <span>⭐</span> <span id="scoreText">0</span>

    <main class="flex-1 relative w-full max-w-4xl mx-auto overflow-hidden cursor-pointer">

        <!-- Player Setup Overlay -->
        <div id="startOverlay" class="absolute inset-0 flex items-center justify-center z-30 bg-sky-900/60 backdrop-blur-md p-4">

                <div class="text-3xl sm:text-4xl font-black text-red-600 drop-shadow float-anim">
                    🕷️ CIAO SUPEREROE! 🦸‍♂️
                </div>

                    >
                </div>

                <button 
                    id="playNowBtn" 
                    type="button"
                    class="pulse-btn bg-red-500 hover:bg-red-600 active:bg-red-700 text-white text-2xl sm:text-3xl font-black py-4 px-8 rounded-2xl shadow-xl border-4 border-white transition transform active:scale-95 flex items-center justify-center gap-3 mt-2 w-full cursor-pointer"
                >
                    <span>GIOCA ORA!</span>

                </button>

    </main>

    <footer class="w-full p-4 bg-white/90 backdrop-blur-md shadow-2xl rounded-t-3xl max-w-4xl mx-auto flex justify-around items-center z-10">
        <button id="leftBtn" class="bg-red-500 hover:bg-red-600 active:bg-red-700 text-white font-black text-4xl w-28 h-18 sm:w-36 sm:h-20 rounded-3xl shadow-lg border-4 border-yellow-300 flex items-center justify-center transition transform active:scale-90">

        </button>
        <div class="text-center hidden sm:block">

            <p class="text-red-500 font-semibold text-xs">Raccogli pizze, stelle e palloncini!</p>
        </div>
        <button id="rightBtn" class="bg-red-500 hover:bg-red-600 active:bg-red-700 text-white font-black text-4xl w-28 h-18 sm:w-36 sm:h-20 rounded-3xl shadow-lg border-4 border-yellow-300 flex items-center justify-center transition transform active:scale-90">
            ➡️
        </button>
    </footer>

    <script>
        // DOM Elements
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreText = document.getElementById('scoreText');
        const encouragementEl = document.getElementById('encouragement');
        const startOverlay = document.getElementById('startOverlay');
        const playerNameInput = document.getElementById('playerNameInput');
        const playNowBtn = document.getElementById('playNowBtn');
        const changeNameBtn = document.getElementById('changeNameBtn');
        const heroBadge = document.getElementById('heroBadge');
        const soundBtn = document.getElementById('soundBtn');
        const playerGreeting = document.getElementById('playerGreeting');

        // State variables
        let playerName = "Spidey";
        let score = 0;
        let gameRunning = false;
        let soundEnabled = true;
        let animationFrameId = null;

        // Audio Context (Synthesizer for kids sounds)
        let audioCtx = null;

        function getAudioContext() {
            if (!audioCtx) {
                const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                if (AudioContextClass) {
                    audioCtx = new AudioContextClass();
                }
            }
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            return audioCtx;
        }

        function playAudio(type) {
            if (!soundEnabled) return;
            const ctxAudio = getAudioContext();
            if (!ctxAudio) return;

            const now = ctxAudio.currentTime;

            if (type === 'thwip') {
                // Web shooting sound
                const osc = ctxAudio.createOscillator();
                const gain = ctxAudio.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(800, now);
                osc.frequency.exponentialRampToValueAtTime(200, now + 0.12);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.12);
                osc.connect(gain);
                gain.connect(ctxAudio.destination);
                osc.start(now);
                osc.stop(now + 0.12);
            } else if (type === 'collect') {
                // Happy chime sound
                const osc = ctxAudio.createOscillator();
                const gain = ctxAudio.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(523.25, now); // C5
                osc.frequency.setValueAtTime(659.25, now + 0.08); // E5
                osc.frequency.setValueAtTime(783.99, now + 0.16); // G5
                gain.gain.setValueAtTime(0.25, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.25);
                osc.connect(gain);
                gain.connect(ctxAudio.destination);
                osc.start(now);
                osc.stop(now + 0.25);
            } else if (type === 'star') {
                // Extra cheerful sound
                const osc = ctxAudio.createOscillator();
                const gain = ctxAudio.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(400, now);
                osc.frequency.exponentialRampToValueAtTime(1200, now + 0.3);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.3);
                osc.connect(gain);
                gain.connect(ctxAudio.destination);
                osc.start(now);
                osc.stop(now + 0.3);
            }
        }

        // Toggle sound
        soundBtn.addEventListener('click', () => {
            soundEnabled = !soundEnabled;
            soundBtn.innerText = soundEnabled ? '🔊' : '🔇';
        });

        function resizeCanvas() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
            if (spidey) {
                spidey.y = canvas.height - 110;
            }
        }
        window.addEventListener('resize', resizeCanvas);

        class SpiderMan {
            constructor() {
                this.width = 90;
                this.height = 100;
                this.x = canvas.width / 2 - 45;
                this.y = canvas.height - 110;
                this.speed = 12;
                this.vx = 0;
                this.targetX = null;
            }

            draw() {
                ctx.save();
                ctx.translate(this.x + this.width / 2, this.y + this.height / 2);

                // Cute Chibi Spider-Man Rendering
                // Legs
                ctx.fillStyle = '#1d4ed8';
                ctx.beginPath();
                ctx.arc(-20, 36, 14, 0, Math.PI * 2);
                ctx.arc(20, 36, 14, 0, Math.PI * 2);
                ctx.fill();

                // Suit Torso
                ctx.fillStyle = '#ef4444';
                ctx.beginPath();
                ctx.roundRect(-25, 0, 50, 46, 14);
                ctx.fill();

                // Spider Chest Symbol
                ctx.fillStyle = '#000000';
                ctx.beginPath();
                ctx.arc(0, 22, 7, 0, Math.PI * 2);
                ctx.fill();

                // Huge Head
                ctx.fillStyle = '#ef4444';
                ctx.beginPath();
                ctx.arc(0, -25, 38, 0, Math.PI * 2);
                ctx.fill();

                // Mask Web Lines
                ctx.strokeStyle = '#b91c1c';
                ctx.lineWidth = 2.5;
                ctx.beginPath();
                ctx.moveTo(0, -63); ctx.lineTo(0, 13);
                ctx.moveTo(-38, -25); ctx.lineTo(38, -25);
                ctx.stroke();

                // Big Friendly Eyes
                ctx.fillStyle = '#000000';
                ctx.beginPath();
                ctx.ellipse(-14, -28, 14, 10, -0.15, 0, Math.PI * 2);
                ctx.ellipse(14, -28, 14, 10, 0.15, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.ellipse(-14, -28, 11, 7, -0.15, 0, Math.PI * 2);
                ctx.ellipse(14, -28, 11, 7, 0.15, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();
            }

            update() {
                if (this.targetX !== null) {
                    let diff = this.targetX - (this.x + this.width / 2);
                    if (Math.abs(diff) < this.speed) {
                        this.x = this.targetX - this.width / 2;
                        this.targetX = null;
                    } else {
                        this.x += Math.sign(diff) * this.speed;
                    }
                } else {
                    this.x += this.vx;
                }

                // Keep inside screen screen borders
                if (this.x < 10) this.x = 10;
                if (this.x > canvas.width - this.width - 10) {
                    this.x = canvas.width - this.width - 10;
                }
            }
        }

        const spidey = new SpiderMan();

        let items = [];
        let particles = [];
        let spawnTimer = 0;

        const itemTypes = [
            { emoji: '🍕', points: 1, name: 'Pizza!' },
            { emoji: '🍩', points: 1, name: 'Ciambella!' },
            { emoji: '⭐', points: 2, name: 'Stella!' },
            { emoji: '🎈', points: 2, name: 'Palloncino!' },
            { emoji: '🎁', points: 3, name: 'Regalo!' }
        ];

        class Item {
            constructor() {
                this.x = Math.random() * (canvas.width - 80) + 40;
                this.y = -50;
                this.speed = Math.random() * 2 + 2.5;
                this.type = itemTypes[Math.floor(Math.random() * itemTypes.length)];
                this.wobble = Math.random() * Math.PI * 2;
            }

            draw() {
                ctx.save();
                ctx.font = '46px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                let renderY = this.y + Math.sin(this.wobble) * 5;
                ctx.fillText(this.type.emoji, this.x, renderY);
                ctx.restore();
            }

            update() {
                this.y += this.speed;
                this.wobble += 0.05;
            }
        }

        class Particle {
            constructor(x, y, text) {
                this.x = x;
                this.y = y;
                this.text = text;
                this.alpha = 1;
                this.vy = -2.5;
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.font = '900 24px Fredoka, sans-serif';
                ctx.fillStyle = '#f59e0b';
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 4;
                ctx.strokeText(this.text, this.x, this.y);
                ctx.fillText(this.text, this.x, this.y);
                ctx.restore();
            }
            update() {
                this.y += this.vy;
                this.alpha -= 0.025;
            }
        }

        // Encouragement popup
        function triggerEncouragement() {
            const praises = [
                `¡BRAVO ${playerName.toUpperCase()}!`,
                `¡SUPER ${playerName.toUpperCase()}!`,
                `¡CAMPIONE!`,
                `¡FANTASTICO!`,
                `¡EVVIVA!`
            ];
            const msg = praises[Math.floor(Math.random() * praises.length)];
            encouragementEl.innerText = msg;
            encouragementEl.classList.remove('hidden');
            setTimeout(() => {
                encouragementEl.classList.add('hidden');
            }, 1000);
        }

        function gameLoop() {
            if (!gameRunning) return;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw clouds
            ctx.fillStyle = 'rgba(255, 255, 255, 0.45)';
            ctx.beginPath();
            ctx.arc(90, 70, 45, 0, Math.PI * 2);
            ctx.arc(140, 60, 55, 0, Math.PI * 2);
            ctx.arc(180, 80, 35, 0, Math.PI * 2);
            ctx.arc(canvas.width - 100, 120, 60, 0, Math.PI * 2);
            ctx.arc(canvas.width - 50, 130, 45, 0, Math.PI * 2);
            ctx.fill();

            // Update Spider-Man
            spidey.update();
            spidey.draw();

            // Spawn items
            spawnTimer++;
            if (spawnTimer > 35) {
                items.push(new Item());
                spawnTimer = 0;
            }

            // Items loop
            for (let i = items.length - 1; i >= 0; i--) {
                let item = items[i];
                item.update();
                item.draw();

                // Collision Check
                let spideyCenterX = spidey.x + spidey.width / 2;
                let spideyCenterY = spidey.y + spidey.height / 2;
                let distX = item.x - spideyCenterX;
                let distY = item.y - spideyCenterY;
                let distance = Math.sqrt(distX * distX + distY * distY);

                if (distance < 55) {
                    score += item.type.points;
                    scoreText.innerText = score;

                    if (item.type.emoji === '⭐' || item.type.emoji === '🎁') {
                        playAudio('star');
                    } else {
                        playAudio('collect');
                    }

                    particles.push(new Particle(item.x, item.y, `+${item.type.points} ${item.type.name}`));
                    
                    if (score % 5 === 0) {
                        triggerEncouragement();
                    }

                    items.splice(i, 1);
                    continue;
                }

                // Remove offscreen items
                if (item.y > canvas.height + 60) {
                    items.splice(i, 1);
                }
            }

            // Particles loop
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.update();
                p.draw();
                if (p.alpha <= 0) {
                    particles.splice(i, 1);
                }
            }

            animationFrameId = requestAnimationFrame(gameLoop);
        }

        function startGame() {
            // Read and format player name
            let inputName = playerNameInput.value.trim();
            if (!inputName) {
                inputName = "Spidey";
            }
            playerName = inputName;

            // Update badges and texts
            heroBadge.innerText = `Super ${playerName} ⚡`;
            playerGreeting.innerText = `Muovi Super ${playerName} e cattura tutto!`;

            // Hide overlay
            startOverlay.style.display = 'none';

            // Reset score & state
            score = 0;
            scoreText.innerText = "0";
            items = [];
            particles = [];
            spidey.x = canvas.width / 2 - spidey.width / 2;

            // Sound activation
            playAudio('thwip');

            // Start loop
            gameRunning = true;
            if (animationFrameId) {
                cancelAnimationFrame(animationFrameId);
            }
            gameLoop();
        }

        // Direct Event Listener Bindings (Ensures start works 100%)
        playNowBtn.addEventListener('click', startGame);
        playNowBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            startGame();
        });

        changeNameBtn.addEventListener('click', () => {
            gameRunning = false;
            if (animationFrameId) cancelAnimationFrame(animationFrameId);
            startOverlay.style.display = 'flex';
        });

        // Touch & Movement Controls
        const leftBtn = document.getElementById('leftBtn');
        const rightBtn = document.getElementById('rightBtn');

        function moveLeft(e) {
            if (e) e.preventDefault();
            spidey.vx = -12;
        }

        function moveRight(e) {
            if (e) e.preventDefault();
            spidey.vx = 12;
        }

        function stopMove(e) {
            if (e) e.preventDefault();
            spidey.vx = 0;
        }

        leftBtn.addEventListener('mousedown', moveLeft);
        leftBtn.addEventListener('mouseup', stopMove);
        leftBtn.addEventListener('touchstart', moveLeft);
        leftBtn.addEventListener('touchend', stopMove);

        rightBtn.addEventListener('mousedown', moveRight);
        rightBtn.addEventListener('mouseup', stopMove);
        rightBtn.addEventListener('touchstart', moveRight);
        rightBtn.addEventListener('touchend', stopMove);

        // Keyboard Controls
        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') moveLeft();
            if (e.key === 'ArrowRight') moveRight();
            if (e.key === 'Enter' && startOverlay.style.display !== 'none') {
                startGame();
            }
        });

        window.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') stopMove();
        });

        // Canvas drag / touch follow
        canvas.addEventListener('touchmove', (e) => {
            if (!gameRunning) return;
            const rect = canvas.getBoundingClientRect();
            spidey.targetX = e.touches[0].clientX - rect.left;
        }, { passive: true });

        canvas.addEventListener('mousemove', (e) => {
            if (!gameRunning) return;
            const rect = canvas.getBoundingClientRect();
            spidey.targetX = e.clientX - rect.left;
        });

        // Initial setup on window load
        window.onload = () => {
            resizeCanvas();
            spidey.draw();
        };
    </script>
</body>
</html>
