<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Timbratura Operai - Mobile.</title>

    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>

    <style>
        body { 
            font-family: Arial; 
            background: #f0f0f0; 
            padding: 10px; 
            margin: 0;
        }

        .card { 
            background: #fff; 
            padding: 15px; 
            border-radius: 10px; 
            max-width: 100%; 
            margin: auto;
        }

        h2, h3 { text-align: center; }

        button { 
            width: 100%; 
            padding: 15px; 
            margin-top: 10px; 
            font-size: 18px; 
            border: none; 
            border-radius: 8px; 
            cursor: pointer;
        }

        .btn-entrata { background: #2e7d32; color: white; }
        .btn-uscita { background: #c62828; color: white; }
        .btn-export { background: #1565c0; color: white; }

        table { 
            width: 100%; 
            border-collapse: collapse; 
            margin-top: 20px; 
            font-size: 14px;
        }

        th, td { 
            border: 1px solid #ccc; 
            padding: 8px; 
            text-align: center; 
        }

        th { background: #e0e0e0; }

        .qr-box {
            display: flex;
            justify-content: space-around;
            margin-top: 20px;
        }

        canvas {
            width: 120px !important;
            height: 120px !important;
        }

        #qr-reader {
            width: 100%;
            max-width: 350px;
            margin: auto;
            display: none;
        }
    </style>
</head>
<body>

<div class="card">

    <h2>QR Code Operai</h2>

    <div class="qr-box">
        <div>
            <h3>Antonio</h3>
            <canvas id="qrAntonio"></canvas>
        </div>

        <div>
            <h3>Marco</h3>
            <canvas id="qrMarco"></canvas>
        </div>
    </div>

    <hr>

    <h2>Timbratura QR</h2>

    <button class="btn-entrata" onclick="startScan('Entrata')">Timbra Entrata</button>
    <button class="btn-uscita" onclick="startScan('Uscita')">Timbra Uscita</button>

    <div id="qr-reader"></div>

    <h3>Storico Timbrature</h3>

    <table id="tabella">
        <thead>
            <tr>
                <th>Operaio</th>
                <th>Tipo</th>
                <th>Data</th>
                <th>Ora</th>
                <th>GPS</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>

    <button class="btn-export" onclick="exportExcel()">Esporta Excel</button>

</div>

<script>
    // QR GENERATOR
    new QRious({ element: document.getElementById("qrAntonio"), value: "Antonio", size: 150 });
    new QRious({ element: document.getElementById("qrMarco"), value: "Marco", size: 150 });

    let tipoTimbratura = null;

    function startScan(tipo) {
        tipoTimbratura = tipo;
        document.getElementById("qr-reader").style.display = "block";

        const qrReader = new Html5Qrcode("qr-reader");

        qrReader.start(
            { facingMode: "environment" },
            { fps: 10, qrbox: { width: 250, height: 250 } },
            qrText => {
                qrReader.stop();
                document.getElementById("qr-reader").style.display = "none";
                registraTimbratura(qrText, tipoTimbratura);
            }
        );
    }

    function registraTimbratura(nome, tipo) {
        navigator.geolocation.getCurrentPosition(pos => {
            const gps = pos.coords.latitude + ", " + pos.coords.longitude;

            const now = new Date();
            const data = now.toLocaleDateString('it-IT');
            const ora = now.toLocaleTimeString('it-IT');

            const record = { operaio: nome, tipo, data, ora, gps };

            salva(record);
            aggiungiRiga(record);

            alert("Timbratura registrata per: " + nome);
        });
    }

    function salva(record) {
        let dati = JSON.parse(localStorage.getItem("timbrature")) || [];
        dati.push(record);
        localStorage.setItem("timbrature", JSON.stringify(dati));
    }

    function aggiungiRiga(r) {
        const tbody = document.querySelector("#tabella tbody");
        const tr = document.createElement("tr");
        tr.innerHTML = `
            <td>${r.operaio}</td>
            <td>${r.tipo}</td>
            <td>${r.data}</td>
            <td>${r.ora}</td>
            <td>${r.gps}</td>
        `;
        tbody.appendChild(tr);
    }

    function exportExcel() {
        let dati = JSON.parse(localStorage.getItem("timbrature")) || [];
        let csv = "Operaio,Tipo,Data,Ora,GPS\n";

        dati.forEach(r => {
            csv += `${r.operaio},${r.tipo},${r.data},${r.ora},${r.gps}\n`;
        });

        const blob = new Blob([csv], { type: "text/csv" });
        const url = URL.createObjectURL(blob);

        const a = document.createElement("a");
        a.href = url;
        a.download = "timbrature.csv";
        a.click();
    }
</script>

</body>
</html>
